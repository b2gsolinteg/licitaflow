name: RC31.8 Login Cleanup Fixed

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-8-clean-essential
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Simplify login visual
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          fn = app.index('def login_page():')
          start = app.index('    st.markdown(\n        """<style>', fn)
          marker = '        </style>""",\n        unsafe_allow_html=True,\n    )'
          end = app.index(marker, start) + len(marker)
          new_style = '''    st.markdown(\n        """<style>\n        html, body, [data-testid="stAppViewContainer"], .stApp {margin:0 !important;padding:0 !important;background:#FFFFFF !important;min-height:100vh !important;color:#293746 !important;overflow:auto !important;}\n        header[data-testid="stHeader"],[data-testid="stToolbar"],[data-testid="stDecoration"],#MainMenu,footer{display:none !important;height:0 !important;}\n        .block-container{max-width:1120px !important;width:100% !important;margin:0 auto !important;padding:4rem 2rem !important;}\n        [data-testid="stAppViewContainer"] *{font-weight:400 !important;}\n        div[data-testid="stHorizontalBlock"]{gap:3rem !important;align-items:center !important;}\n        div[data-testid="stHorizontalBlock"] > div[data-testid="stColumn"]{background:#FFFFFF !important;padding:0 !important;}\n        .ln-login-intro{color:#293746;font-size:1.9rem;line-height:1.22;margin:.8rem 0 .65rem;}\n        .ln-login-copy{color:#667786;font-size:1rem;line-height:1.55;max-width:32rem;}\n        .ln-price{text-align:left;line-height:1.15;margin:0 0 1rem;}\n        .ln-price span{display:inline;color:#667786;font-size:.82rem;margin-right:.35rem;}\n        .ln-price strong,.ln-price small{color:#486F74;font-size:1rem;font-weight:400 !important;}\n        .st-key-auth_card{width:100% !important;max-width:560px !important;margin:0 auto !important;padding:1.25rem 1.35rem 1.35rem !important;background:#FFFFFF !important;border:1px solid #DCE3E8 !important;border-radius:14px !important;box-shadow:none !important;}\n        .st-key-auth_card > div,.st-key-auth_card [data-testid="stVerticalBlock"]{background:transparent !important;}\n        .ln-auth-nav{display:grid !important;grid-template-columns:repeat(4,minmax(0,1fr)) !important;width:100% !important;gap:.25rem !important;margin:0 0 1rem !important;}\n        .ln-auth-nav a{display:flex !important;align-items:center !important;justify-content:center !important;min-height:2.7rem !important;padding:.35rem .1rem !important;color:#526371 !important;font-size:.76rem !important;text-align:center !important;text-decoration:none !important;border:1px solid #DCE3E8 !important;border-radius:8px !important;background:#FFFFFF !important;}\n        .ln-auth-nav a.active{color:#293746 !important;border-color:#AFC5C8 !important;background:#EDF3F4 !important;}\n        .st-key-auth_card label,.st-key-auth_card label p,.st-key-auth_card p,.st-key-auth_card span{color:#293746 !important;}\n        .st-key-auth_card [data-baseweb="input"],.st-key-auth_card [data-baseweb="base-input"],.st-key-auth_card [data-testid="stTextInput"] > div > div{background:#FFFFFF !important;border-color:#C8D3DB !important;color:#293746 !important;border-radius:9px !important;}\n        .st-key-auth_card input{background:#FFFFFF !important;color:#293746 !important;min-height:3rem !important;caret-color:#293746 !important;-webkit-text-fill-color:#293746 !important;}\n        .st-key-auth_card input::placeholder{color:#8A98A5 !important;-webkit-text-fill-color:#8A98A5 !important;opacity:1 !important;}\n        .st-key-auth_card [data-testid="stForm"]{background:#FFFFFF !important;border:0 !important;padding:0 !important;}\n        .st-key-auth_card .stFormSubmitButton button{min-height:3rem !important;border-radius:9px !important;background:#EAF2F3 !important;color:#293746 !important;border:1px solid #ADC6C9 !important;box-shadow:none !important;font-size:.94rem !important;}\n        .ln-forgot{text-align:right;margin-top:-2rem;margin-bottom:1rem;padding-right:.1rem;font-size:.78rem;color:#486F74;position:relative;z-index:4;}\n        .ln-forgot a{color:#486F74 !important;text-decoration:none !important;}\n        .ln-login-footer{width:100%;max-width:560px;margin:1rem auto 0;color:#667786;text-align:center;font-size:.82rem;line-height:1.5;}\n        .ln-login-footer strong{color:#486F74 !important;font-weight:400 !important;}\n        .ln-trial-seal{width:100%;margin:.1rem auto .75rem;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:0;box-shadow:none;padding:0;}\n        .ln-trial-seal .seal-badge{width:auto;height:auto;display:block;border-radius:8px;color:#526371;background:#F4F7F9;border:1px solid #DCE3E8;box-shadow:none;font-weight:400 !important;line-height:1.3;margin-bottom:.5rem;padding:.45rem .7rem;}\n        .ln-trial-seal .seal-badge::before,.ln-trial-seal .seal-badge::after,.ln-trial-seal .seal-stars{display:none !important;}\n        .ln-trial-seal .seal-days,.ln-trial-seal .seal-free{display:inline;font-size:.9rem;letter-spacing:0;color:#526371;background:transparent;padding:0;margin:0 .1rem;border-radius:0;}\n        .ln-trial-seal .seal-copy{color:#667786;font-size:.88rem;line-height:1.4;text-align:center;}\n        .ln-trial-seal .seal-copy strong{color:#486F74;font-size:.88rem;font-weight:400 !important;}\n        .ln-login-footer .dev{margin-top:.15rem;padding-top:.6rem;border-top:1px solid #E3E8ED;}\n        @media(max-width:800px){.block-container{padding:1.5rem 1rem !important;}div[data-testid="stHorizontalBlock"]{display:block !important;}.ln-login-intro,.ln-login-copy{text-align:center;margin-left:auto;margin-right:auto;}.ln-price{text-align:center;margin-top:1rem;}.st-key-auth_card,.ln-login-footer{max-width:560px !important;margin-left:auto !important;margin-right:auto !important;}.ln-auth-nav{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}}\n        </style>""",\n        unsafe_allow_html=True,\n    )'''
          app = app[:start] + new_style + app[end:]
          app = app.replace('left, right = st.columns([58.5, 41.5], gap=None)', 'left, right = st.columns([1, 1], gap="large")', 1)
          old_left = '''    with left:\n        hero_path = PROJECT_ROOT / "assets" / "login-hero-definitivo.png"\n        st.image(str(hero_path), width="stretch")\n'''
          new_left = '''    with left:\n        if LOGO_PATH.exists():\n            st.image(str(LOGO_PATH), width=300)\n        st.markdown('<div class="ln-login-intro">Licitações sem complicação.</div>', unsafe_allow_html=True)\n        st.markdown('<div class="ln-login-copy">Encontre editais, veja o que o governo quer comprar e organize os certames que você decidiu participar.</div>', unsafe_allow_html=True)\n'''
          if old_left not in app:
              raise SystemExit('Bloco visual esquerdo do login não encontrado')
          app = app.replace(old_left, new_left, 1)
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('tests/test_rc31_8_clean_essential.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    def test_beginner_navigation_hides_future_modules(self):\n'
          addition = '''    def test_public_login_is_also_light_and_neutral(self):\n        app = (ROOT / "app.py").read_text(encoding="utf-8")\n        start = app.index("def login_page():")\n        end = app.index("def legal_acceptance_page", start)\n        login = app[start:end]\n        self.assertNotIn("#031329", login)\n        self.assertNotIn("#D99C17", login)\n        self.assertNotIn("linear-gradient(90deg,#C88D13,#DEA92B)", login)\n        self.assertIn("Licitações sem complicação.", login)\n\n'''
          if anchor not in test:
              raise SystemExit('Âncora de teste não encontrada')
          test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Compile and run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src tests
          python -m unittest discover -s tests -v
      - name: Restore normal Quality Gate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality.yml
          git rm .github/workflows/rc31-8-login-cleanup-fixed.yml
          git add app.py tests/test_rc31_8_clean_essential.py .github/workflows/quality.yml .github/workflows/rc31-8-login-cleanup-fixed.yml
          git commit -m "style: deixar entrada do Essential clara e neutra"
          git push origin HEAD:agent/rc31-8-clean-essential
