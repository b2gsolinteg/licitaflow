name: RC31.17 Materialize Faithful Layout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feat/rc31-17-faithful-layout'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc31-17-faithful-layout
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.17 faithful visual system
        run: python scripts/rc31_17_apply.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite unit suite before commit
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Remove one-time materializer and commit real source
        run: |
          rm -f scripts/rc31_17_apply.py .github/workflows/rc31-17-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/config.py src/essential_discovery.py tests scripts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "feat: alinhar fielmente layout global RC31.17"
          git push origin HEAD:feat/rc31-17-faithful-layout
