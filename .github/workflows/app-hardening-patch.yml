name: App Hardening Patch

on:
  push:
    branches:
      - agent/production-hardening-10

permissions:
  contents: write

concurrency:
  group: app-hardening-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-10
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic app patch
        run: python scripts/patch_app_hardening.py

      - name: Validate Python and UI regressions
        run: |
          python -m py_compile app.py
          python -m unittest -v tests/test_invitation_activation_ui.py tests/test_invite_recovery_ui.py

      - name: Remove one-shot patch tooling
        run: |
          rm scripts/patch_app_hardening.py
          rm .github/workflows/app-hardening-patch.yml

      - name: Commit patched app
        run: |
          git config user.name "licitanexo-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py scripts/patch_app_hardening.py .github/workflows/app-hardening-patch.yml
          git diff --cached --check
          git commit -m "fix: corrigir UX e CSS da autenticação"
          git push origin HEAD:agent/production-hardening-10
