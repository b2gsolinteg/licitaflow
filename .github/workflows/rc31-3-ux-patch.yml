name: RC31.3 UX Patch

on:
  push:
    branches:
      - agent/rc31-3-ux-help-audit

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rc31-3-ux-help-audit
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.3 patch
        run: python scripts/patch_rc31_3.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit validated RC31.3
        run: |
          rm -f scripts/patch_rc31_3.py .github/workflows/rc31-3-ux-patch.yml .github/rc31-3-trigger.txt
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: RC31.3 UX fornecedores login e guias PDF"
          git push origin HEAD:agent/rc31-3-ux-help-audit
