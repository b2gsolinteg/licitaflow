name: Dependency Lock Once

on:
  push:
    branches:
      - agent/production-hardening-10

permissions:
  contents: write

concurrency:
  group: dependency-lock-once
  cancel-in-progress: false

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-10
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze --exclude-editable | LC_ALL=C sort > requirements.lock
          test -s requirements.lock

      - name: Remove one-shot workflow
        run: rm .github/workflows/dependency-lock-once.yml

      - name: Commit lockfile
        run: |
          git config user.name "licitanexo-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add requirements.lock .github/workflows/dependency-lock-once.yml
          git diff --cached --check
          git commit -m "build: fixar dependências Python resolvidas"
          git push origin HEAD:agent/production-hardening-10
