name: PNCP Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "30 5 * * 0"
  pull_request:
    paths:
      - "scripts/pncp_sync_worker.py"
      - "tests/test_pncp_worker.py"
      - ".github/workflows/pncp-worker.yml"
      - "src/pncp.py"
      - "src/database.py"
      - "src/db_runtime.py"
      - "requirements.lock"

concurrency:
  group: pncp-worker-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Dependencias fixadas
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Testes simulados PNCP
        run: python -m unittest -v tests/test_pncp_worker.py

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LICITANEXO_DB_BACKEND: postgres
      LICITANEXO_DB_SCHEMA: licitanexo
      LICITANEXO_PGHOST: ${{ secrets.LICITANEXO_PGHOST }}
      LICITANEXO_PGPORT: "5432"
      LICITANEXO_PGDATABASE: postgres
      LICITANEXO_PGUSER: ${{ secrets.LICITANEXO_PGUSER }}
      LICITANEXO_PGPASSWORD: ${{ secrets.LICITANEXO_PGPASSWORD }}
      LICITANEXO_PGSSLMODE: require
      PNCP_WORKER_TIMEOUT: "30"
      PNCP_WORKER_MAX_ATTEMPTS: "4"
      PNCP_WORKER_PAGE_DELAY: "0.25"
      PNCP_WORKER_MAX_PAGES_PER_MODALITY: "120"
      PNCP_FULL_TIMEOUT: "60"
      PNCP_FULL_MAX_ATTEMPTS: "6"
      PNCP_FULL_PAGE_DELAY: "1.8"
      PNCP_FULL_HORIZON_DAYS: "60"
      PNCP_AUTO_FULL_RECONCILE: ${{ github.event_name == 'schedule' && github.event.schedule == '30 5 * * 0' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Dependencias fixadas
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Atualizar catalogo PNCP
        run: python scripts/pncp_sync_worker.py
