name: RC31.8 Clean Essential Patch

on:
  push:
    branches:
      - agent/rc31-8-clean-essential

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-8-clean-essential
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Add Brazilian state flags
        run: |
          mkdir -p assets/state_flags
          for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
            curl -fsSL "https://raw.githubusercontent.com/akagabi/bandeira-dos-estados-do-brasil/master/${uf}.svg" -o "assets/state_flags/${uf}.svg"
          done
          curl -fsSL "https://raw.githubusercontent.com/akagabi/bandeira-dos-estados-do-brasil/master/LICENSE" -o assets/state_flags/LICENSE
          cat > assets/state_flags/README.md <<'EOF'
          Bandeiras dos estados brasileiros usadas na tela Por Estado.

          Fonte: akagabi/bandeira-dos-estados-do-brasil
          Licença: MIT — ver LICENSE neste diretório.
          EOF

      - name: Apply clean Essential patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado: {label}")
              return text.replace(old, new, 1)

          # Streamlit: tema claro, neutro e sem dourado/navy.
          Path('.streamlit/config.toml').write_text('''[theme]\nprimaryColor = "#6F9297"\nbackgroundColor = "#FFFFFF"\nsecondaryBackgroundColor = "#F4F7F9"\ntextColor = "#293746"\nfont = "sans serif"\n\n[server]\nheadless = true\n''', encoding='utf-8')

          # Versão.
          config_path = Path('src/config.py')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('APP_VERSION = "1.0 Essential RC31.6"', 'APP_VERSION = "1.0 Essential RC31.8"')
          config_path.write_text(config, encoding='utf-8')

          # Portal: linguagem simples para iniciantes.
          sources_path = Path('src/sources.py')
          sources = sources_path.read_text(encoding='utf-8')
          sources = sources.replace('"label": "🟢 Gratuito",', '"label": "Gratuito",')
          sources = sources.replace('"label": "🟡 Pode exigir pagamento",', '"label": "Pode ser pago",')
          sources = sources.replace('"label": "🟠 Verificar condições",', '"label": "Consultar condições",')
          sources = sources.replace('''            "status": "unknown",\n            "label": "⚪ Custo não identificado",\n            "detail": "O LicitaNexo não identificou com segurança a condição de acesso. Confira no portal antes da participação.",''', '''            "status": "unknown",\n            "label": "Não identificado",\n            "detail": "Consultar edital.",''')
          sources = sources.replace('''        "status": "check",\n        "label": "🟠 Verificar condições",\n        "detail": "Confirme cadastro, eventual taxa e condições de acesso diretamente no portal antes de participar.",''', '''        "status": "check",\n        "label": "Consultar condições",\n        "detail": "Consultar edital ou site da disputa.",''')
          sources_path.write_text(sources, encoding='utf-8')

          # Banco: filtro eficiente por termos do site da disputa e calendário apenas de quem vai participar.
          db_path = Path('src/database.py')
          db = db_path.read_text(encoding='utf-8')
          old_sig = '''    def list_global_catalog(self, search="", states=None, cities=None, modalities=None, srp=None, minimum=None,\n                            maximum=None, closing_from=None, closing_to=None, limit=5000,\n                            order_by="recent"): \n        sql = "SELECT * FROM global_pncp_catalog WHERE 1=1"\n        params = []'''
          new_sig = '''    def list_global_catalog(self, search="", states=None, cities=None, modalities=None, srp=None, minimum=None,\n                            maximum=None, closing_from=None, closing_to=None, limit=5000,\n                            order_by="recent", portal_terms=None): \n        sql = "SELECT * FROM global_pncp_catalog WHERE 1=1"\n        params = []\n        portal_terms = [str(term or "").strip().lower() for term in (portal_terms or []) if str(term or "").strip()]\n        if portal_terms:\n            portal_clauses = []\n            for term in portal_terms:\n                portal_clauses.append("(lower(source_name) LIKE ? OR lower(source_url) LIKE ?)")\n                like = f"%{term}%"\n                params.extend([like, like])\n            sql += " AND (" + " OR ".join(portal_clauses) + ")"'''
          db = must_replace(db, old_sig, new_sig, 'assinatura list_global_catalog')
          db = db.replace(
              '''            WHERE o.company_id=? AND d.certame_at IS NOT NULL AND d.certame_at<>''\n''',
              '''            WHERE o.company_id=? AND d.decision='Participar'\n              AND d.certame_at IS NOT NULL AND d.certame_at<>''\n''',
              1,
          )
          db_path.write_text(db, encoding='utf-8')

          # Discovery Essential.
          discovery_path = Path('src/essential_discovery.py')
          d = discovery_path.read_text(encoding='utf-8')
          d = d.replace('from datetime import date, datetime', 'from datetime import date, datetime, time')
          d = d.replace('from html import escape\n', 'from html import escape\nfrom pathlib import Path\n')
          d = d.replace(
              'from .sources import opportunity_source_and_portal, pncp_official_url, portal_access_info',
              'from .sources import PORTAL_ACCESS, opportunity_source_and_portal, pncp_official_url, portal_access_info',
          )

          marker = '''BRAZIL_STATES = (\n    "AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS",\n    "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO",\n)\n'''
          insert = marker + '''\nSTATE_NAMES = {\n    "AC": "Acre", "AL": "Alagoas", "AP": "Amapá", "AM": "Amazonas", "BA": "Bahia",\n    "CE": "Ceará", "DF": "Distrito Federal", "ES": "Espírito Santo", "GO": "Goiás",\n    "MA": "Maranhão", "MT": "Mato Grosso", "MS": "Mato Grosso do Sul", "MG": "Minas Gerais",\n    "PA": "Pará", "PB": "Paraíba", "PR": "Paraná", "PE": "Pernambuco", "PI": "Piauí",\n    "RJ": "Rio de Janeiro", "RN": "Rio Grande do Norte", "RS": "Rio Grande do Sul",\n    "RO": "Rondônia", "RR": "Roraima", "SC": "Santa Catarina", "SP": "São Paulo",\n    "SE": "Sergipe", "TO": "Tocantins",\n}\nFLAGS_DIR = Path(__file__).resolve().parents[1] / "assets" / "state_flags"\nPORTAL_OPTIONS = ("Todos os sites", *PORTAL_ACCESS.keys())\nPORTAL_SEARCH_TERMS = {\n    "Compras.gov": ("compras.gov", "comprasnet", "siasg", "gov.br/compras"),\n    "BLL Compras": ("bll",),\n    "BNC Compras": ("bnc", "bolsa nacional de compras"),\n    "BBMNET": ("bbmnet", "bolsa brasileira de mercadorias"),\n    "LicitaNET": ("licitanet",),\n    "M2A Compras": ("m2a",),\n    "Portal de Compras Públicas": ("portal de compras publicas", "portal de compras públicas"),\n    "Licitações-e / Banco do Brasil": ("banco do brasil", "licitacoes-e", "licitações-e"),\n    "BEC-SP": ("bec-sp", "bec.sp.gov.br", "bolsa eletronica de compras", "bolsa eletrônica de compras"),\n}\n'''
          d = must_replace(d, marker, insert, 'constantes de estados')

          # CSS da área Essential: branco, leve, sem dourado, sem navy e sem negrito.
          style_pattern = re.compile(r'def _apply_styles\(\) -> None:\n.*?\n\n@st\.cache_data', re.S)
          style_replacement = '''def _apply_styles() -> None:\n    st.markdown(\n        """\n        <style>\n        .stApp,[data-testid="stAppViewContainer"],[data-testid="stMain"]{background:#FFFFFF !important;}\n        [data-testid="stMain"] .block-container{max-width:1180px !important;padding-top:1.15rem !important;}\n        [data-testid="stMain"] *{font-weight:400 !important;}\n        [data-testid="stMain"] h1,[data-testid="stMain"] h2,[data-testid="stMain"] h3,\n        [data-testid="stMain"] p,[data-testid="stMain"] label p,[data-testid="stMain"] .stCaption p{color:#293746 !important;}\n        [data-testid="stMain"] div[data-testid="stVerticalBlockBorderWrapper"]{background:#FFFFFF !important;border-color:#DCE3E8 !important;box-shadow:none !important;}\n        .ln-discovery-title{font-size:1.95rem;font-weight:400 !important;letter-spacing:-.015em;margin:.05rem 0 .2rem;color:#293746}\n        .ln-discovery-sub{color:#667786;font-size:.96rem;margin:0 0 1rem}\n        .ln-modality-badge{display:inline-block;background:#F2F5F7;color:#526371;border:1px solid #DCE3E8;border-radius:999px;padding:.2rem .6rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.02em}\n        .ln-reference{font-size:1.05rem;color:#293746;margin:.42rem 0 .7rem}\n        .ln-info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55rem;margin:.15rem 0 .8rem}\n        .ln-info-box,.ln-meta-box{background:#FFFFFF;border:1px solid #DCE3E8;border-radius:12px;padding:.72rem .76rem;min-height:82px}\n        .ln-info-label,.ln-meta-label{font-size:.69rem;color:#71808D;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.30rem}\n        .ln-info-value,.ln-meta-value{color:#293746;font-size:.9rem;line-height:1.28}\n        .ln-info-extra,.ln-meta-help{color:#71808D;font-size:.70rem;margin-top:.32rem;line-height:1.32}\n        .ln-object-label{font-size:.72rem;color:#667786;text-transform:uppercase;margin:.3rem 0 .18rem}\n        .ln-meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:.65rem 0}\n        .ln-meta-link{color:#3F7076;text-decoration:none;border-bottom:1px solid #B8CDD0}\n        .ln-items-box{background:#FFFFFF;border:1px solid #DCE3E8;border-radius:12px;padding:.72rem .78rem;margin:.65rem 0}\n        .ln-items-title{color:#293746;font-size:.88rem;margin-bottom:.4rem}\n        .ln-item-row{display:grid;grid-template-columns:48px minmax(0,1fr) 130px 132px;gap:.5rem;align-items:start;padding:.42rem .08rem;border-top:1px solid #EDF1F4;color:#344452}\n        .ln-item-row:first-of-type{border-top:0}\n        .ln-item-number,.ln-item-qty,.ln-item-price{font-size:.74rem;line-height:1.32;color:#667786}\n        .ln-item-desc{font-size:.78rem;line-height:1.32}\n        .ln-item-qty,.ln-item-price{text-align:right}\n        .ln-items-note{font-size:.72rem;color:#71808D;margin-top:.35rem}\n        [data-testid="stMain"] .stButton button,[data-testid="stMain"] .stDownloadButton button{background:#FFFFFF !important;color:#293746 !important;border:1px solid #CCD6DD !important;box-shadow:none !important;}\n        [data-testid="stMain"] .stButton button[kind="primary"],[data-testid="stMain"] button[kind="primary"]{background:#EAF2F3 !important;color:#293746 !important;border:1px solid #ADC6C9 !important;box-shadow:none !important;}\n        [data-testid="stMain"] .stButton button:hover{background:#F4F7F8 !important;border-color:#AFC0C9 !important;}\n        [data-testid="stMain"] div[class*="st-key-state_"] button{min-height:2.8rem !important;font-size:.88rem !important;background:#FFFFFF !important;color:#293746 !important;border:1px solid #CCD6DD !important;}\n        .ln-state-card{min-height:142px;}\n        @media(max-width:900px){.ln-info-grid,.ln-meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ln-item-row{grid-template-columns:38px minmax(0,1fr)}.ln-item-qty,.ln-item-price{text-align:left;grid-column:2}}\n        </style>\n        """,\n        unsafe_allow_html=True,\n    )\n\n\n@st.cache_data'''
          d, n = style_pattern.subn(style_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir _apply_styles')

          d = d.replace('        "order": "recent",\n', '        "order": "recent",\n        "portal": "Todos os sites",\n', 1)

          query_pattern = re.compile(r'def _query_catalog\(db, criteria: dict, \*, limit: int = 10000\) -> list\[dict\]:\n.*?\n\n\ndef _save_to_list', re.S)
          query_replacement = '''def _query_catalog(db, criteria: dict, *, limit: int = 10000) -> list[dict]:\n    cities = [str(criteria.get("city") or "").strip()] if str(criteria.get("city") or "").strip() else []\n    portal = str(criteria.get("portal") or "Todos os sites")\n    return db.list_global_catalog(\n        search=str(criteria.get("keyword") or "").strip(),\n        states=list(criteria.get("states") or []),\n        cities=cities,\n        modalities=list(criteria.get("modalities") or []),\n        minimum=criteria.get("minimum"),\n        maximum=criteria.get("maximum"),\n        closing_from=criteria.get("closing_from") or date.today().isoformat(),\n        closing_to=criteria.get("closing_to"),\n        limit=limit,\n        order_by=str(criteria.get("order") or "recent"),\n        portal_terms=PORTAL_SEARCH_TERMS.get(portal),\n    )\n\n\ndef _save_to_list'''
          d, n = query_pattern.subn(query_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir _query_catalog')

          card_pattern = re.compile(r'def _render_card\(db, user: dict, item: dict, pack: dict\) -> None:\n.*?\n\n\ndef _render_results', re.S)
          card_replacement = '''def _render_card(db, user: dict, item: dict, pack: dict) -> None:\n    company_id = user["company_id"]\n    modality = str(item.get("modality") or "Licitação")\n    control = str(item.get("pncp_control_number") or "").strip()\n    reference = control or "Contratação pública"\n    city = str(item.get("city") or "Município não informado")\n    state = str(item.get("state") or "--")\n    agency = str(item.get("agency") or "Órgão não informado")\n    estimated_value = item.get("estimated_value")\n    value = format_brl(estimated_value) if estimated_value not in (None, "") else "Não informado"\n    opening = item.get("opening_at") or item.get("closing_at")\n    deadline = item.get("closing_at")\n    opening_text = _datetime_text(opening)\n    countdown = _countdown(deadline)\n    obj = str(item.get("object") or "Objeto não informado").strip()\n\n    source_name, portal = opportunity_source_and_portal(\n        item.get("source_name"), item.get("source_channel"), item.get("source_url")\n    )\n    access = portal_access_info(portal)\n    source_url = str(item.get("source_url") or "").strip()\n    has_site = source_url.startswith(("http://", "https://"))\n    portal_text = escape(portal if portal not in {"", "Não informado"} else "Não identificado")\n    if portal_text == "Não identificado":\n        portal_help = "Consultar edital."\n    elif has_site:\n        safe_url = escape(source_url, quote=True)\n        portal_text = f'<a class="ln-meta-link" href="{safe_url}" target="_blank" rel="noopener noreferrer">{portal_text}</a>'\n        portal_help = "Clique no nome para abrir o site."\n    else:\n        portal_help = "Consultar edital para confirmar o endereço."\n\n    with st.container(border=True):\n        st.markdown(f'<span class="ln-modality-badge">{escape(modality)}</span>', unsafe_allow_html=True)\n        st.markdown(f'<div class="ln-reference">{escape(reference)}</div>', unsafe_allow_html=True)\n        extra = f'<div class="ln-info-extra">{escape(countdown)}</div>' if countdown else ""\n        st.markdown(\n            '<div class="ln-info-grid">'\n            f'<div class="ln-info-box"><div class="ln-info-label">Cidade</div><div class="ln-info-value">{escape(city)} — {escape(state)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Órgão</div><div class="ln-info-value">{escape(agency)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Valor</div><div class="ln-info-value">{escape(value)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Data e prazo</div><div class="ln-info-value">{escape(opening_text)}</div>{extra}</div>'\n            '</div>', unsafe_allow_html=True,\n        )\n        st.markdown('<div class="ln-object-label">O que o governo quer comprar ou contratar</div>', unsafe_allow_html=True)\n        st.write(obj)\n        st.markdown(\n            '<div class="ln-meta-grid">'\n            f'<div class="ln-meta-box"><div class="ln-meta-label">Onde participar</div><div class="ln-meta-value">{portal_text}</div><div class="ln-meta-help">{escape(portal_help)}</div></div>'\n            f'<div class="ln-meta-box"><div class="ln-meta-label">Custo do acesso</div><div class="ln-meta-value">{escape(access["label"])}</div><div class="ln-meta-help">{escape(access["detail"])}</div></div>'\n            '</div>', unsafe_allow_html=True,\n        )\n        _render_items(item, pack)\n\n        official = pncp_official_url(control)\n        primary_url = official or (source_url if has_site else "")\n        a1, a2 = st.columns(2)\n        if primary_url:\n            a1.link_button("Acessar edital", primary_url, width="stretch")\n        else:\n            a1.button("Acessar edital", disabled=True, width="stretch", key=f"no_link_{item['id']}")\n        if a2.button("Salvar na lista", key=f"save_list_{item['id']}", width="stretch"):\n            try:\n                _save_to_list(db, company_id, item["id"])\n            except Exception as exc:\n                st.error(f"Não foi possível salvar este edital: {exc}")\n\n\ndef _render_results'''
          d, n = card_pattern.subn(card_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir _render_card')

          search_pattern = re.compile(r'def search_page\(db, user: dict, usage=None\) -> None:\n.*?\n\n\ndef state_page', re.S)
          search_replacement = '''def search_page(db, user: dict, usage=None) -> None:\n    _apply_styles()\n    company_id = user["company_id"]\n    defaults = _profile_defaults(db, company_id)\n    current = st.session_state.get("essential_search_criteria") or {}\n\n    st.markdown('<div class="ln-discovery-title">🔎 Buscar licitações</div>', unsafe_allow_html=True)\n    st.markdown('<div class="ln-discovery-sub">Pesquise pelo que deseja vender. Se deixar em branco, mostramos editais de vários tipos.</div>', unsafe_allow_html=True)\n\n    with st.form("essential_quick_search", clear_on_submit=False, enter_to_submit=False):\n        keyword = st.text_input(\n            "O que você procura?",\n            value=str(current.get("keyword") if "keyword" in current else defaults["keyword"]),\n            placeholder="Ex.: papel A4, pneus, medicamentos, uniformes...",\n        )\n        c1, c2 = st.columns(2)\n        states = c1.multiselect(\n            "Estado", list(BRAZIL_STATES),\n            default=list(current.get("states") if "states" in current else defaults["states"]),\n            placeholder="Brasil inteiro",\n        )\n        city = c2.text_input("Cidade (opcional)", value=str(current.get("city") or ""), placeholder="Ex.: Londrina")\n        m1, m2 = st.columns(2)\n        modalities = m1.multiselect(\n            "Modalidade", list(MODALITIES.keys()),\n            default=list(current.get("modalities") if "modalities" in current else defaults["modalities"]),\n            placeholder="Todas",\n        )\n        current_portal = str(current.get("portal") or "Todos os sites")\n        portal_index = PORTAL_OPTIONS.index(current_portal) if current_portal in PORTAL_OPTIONS else 0\n        portal = m2.selectbox("Site da disputa", PORTAL_OPTIONS, index=portal_index)\n        v1, v2 = st.columns(2)\n        min_default = current.get("minimum") if "minimum" in current else defaults["minimum"]\n        max_default = current.get("maximum") if "maximum" in current else defaults["maximum"]\n        minimum_text = v1.text_input("Valor mínimo", value="" if min_default in (None, "") else str(min_default), placeholder="Sem mínimo")\n        maximum_text = v2.text_input("Valor máximo", value="" if max_default in (None, "") else str(max_default), placeholder="Sem máximo")\n        submitted = st.form_submit_button("Buscar licitações", type="primary", width="stretch")\n\n    if submitted:\n        minimum = parse_brl(minimum_text) if minimum_text.strip() else None\n        maximum = parse_brl(maximum_text) if maximum_text.strip() else None\n        if minimum_text.strip() and minimum is None:\n            st.error("Confira o valor mínimo digitado.")\n            return\n        if maximum_text.strip() and maximum is None:\n            st.error("Confira o valor máximo digitado.")\n            return\n        current = _criteria(\n            keyword=keyword.strip(), city=city.strip(), states=states, modalities=modalities,\n            minimum=minimum, maximum=maximum, portal=portal,\n        )\n        st.session_state["essential_search_criteria"] = current\n        st.session_state["essential_search_page"] = 1\n        if usage is not None:\n            usage.record_search(company_id, user.get("id", ""), keyword.strip())\n        db.save_company_profile(\n            company_id, search_keyword=keyword.strip(), service_states=", ".join(states),\n            search_modalities="|".join(modalities), search_minimum=minimum, search_maximum=maximum,\n            search_order="Mais recentes",\n        )\n\n    if not current:\n        st.info("Digite uma palavra, escolha um estado ou clique em Buscar licitações para ver editais abertos.")\n        return\n\n    with st.spinner("Buscando editais abertos..."):\n        items = _query_catalog(db, current)\n    st.markdown("### Editais abertos para participação")\n    _render_results(db, user, items, page_key="essential_search_page", per_page=6)\n\n\ndef state_page'''
          d, n = search_pattern.subn(search_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir search_page')

          state_pattern = re.compile(r'def state_page\(db, user: dict\) -> None:\n.*?\n\n\ndef city_page', re.S)
          state_replacement = '''def state_page(db, user: dict) -> None:\n    _apply_styles()\n    st.markdown('<div class="ln-discovery-title">🗺️ Por Estado</div>', unsafe_allow_html=True)\n    st.markdown('<div class="ln-discovery-sub">Escolha um estado para ver os editais abertos para participação.</div>', unsafe_allow_html=True)\n    counts = db.global_catalog_group_counts("state", closing_from=date.today().isoformat())\n    if not counts:\n        st.info("Ainda não há editais abertos por estado.")\n        return\n    for start in range(0, len(counts), 4):\n        cols = st.columns(4)\n        for col, row in zip(cols, counts[start:start + 4]):\n            state = str(row.get("label") or "").upper()\n            total = int(row.get("total") or 0)\n            with col.container(border=True):\n                flag = FLAGS_DIR / f"{state.lower()}.svg"\n                if flag.exists():\n                    st.image(str(flag), width=62)\n                st.write(f"{STATE_NAMES.get(state, state)} ({state})")\n                st.caption(f"{total:,} editais abertos".replace(",", "."))\n                if st.button("Ver editais", key=f"state_{state}", width="stretch"):\n                    st.session_state["essential_search_criteria"] = _criteria(states=[state])\n                    st.session_state["essential_search_page"] = 1\n                    st.session_state["_navigation_request"] = "🔎 Buscar licitações"\n                    st.rerun()\n\n\ndef city_page'''
          d, n = state_pattern.subn(state_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir state_page')

          # Filtro avançado também pode restringir pelo site da disputa.
          old_adv = '''        modalities = st.multiselect("Modalidades", list(MODALITIES.keys()), placeholder="Todas")\n        keyword = st.text_input("O que você procura?", placeholder="Ex.: material de limpeza")'''
          new_adv = '''        m1, m2 = st.columns(2)\n        modalities = m1.multiselect("Modalidades", list(MODALITIES.keys()), placeholder="Todas")\n        portal = m2.selectbox("Site da disputa", PORTAL_OPTIONS)\n        keyword = st.text_input("O que você procura?", placeholder="Ex.: material de limpeza")'''
          d = must_replace(d, old_adv, new_adv, 'portal no filtro avançado')
          d = d.replace(
              'minimum=minimum, maximum=maximum,\n                    closing_from=start_date.isoformat(),',
              'minimum=minimum, maximum=maximum, portal=portal,\n                    closing_from=start_date.isoformat(),',
              1,
          )

          mylist_pattern = re.compile(r'def my_list_page\(db, user: dict\) -> None:\n.*?\n\n\ndef preferences_page', re.S)
          mylist_replacement = '''def my_list_page(db, user: dict) -> None:\n    _apply_styles()\n    company_id = user["company_id"]\n    st.markdown('<div class="ln-discovery-title">❤️ Minha lista</div>', unsafe_allow_html=True)\n    st.markdown('<div class="ln-discovery-sub">Decida apenas se vai participar, não vai participar ou quer descartar o edital.</div>', unsafe_allow_html=True)\n    rows = [\n        row for row in db.pipeline_summaries(company_id, "")\n        if str(row.get("stage") or "") in {"Nova oportunidade", "Decisão"}\n    ]\n    if not rows:\n        st.info("Sua lista está vazia. Salve um edital durante a busca para encontrá-lo aqui depois.")\n        return\n\n    for row in rows:\n        source_name, portal = opportunity_source_and_portal(\n            row.get("source_name"), row.get("source_channel"), row.get("source_url")\n        )\n        access = portal_access_info(portal)\n        with st.container(border=True):\n            st.write(row.get("agency") or "Órgão não informado")\n            st.write(row.get("object") or "Objeto não informado")\n            estimated_value = row.get("estimated_value")\n            value = format_brl(estimated_value) if estimated_value not in (None, "") else "Não informado"\n            st.caption(\n                f"{row.get('city') or 'Município não informado'}/{row.get('state') or '--'} · "\n                f"{row.get('modality') or 'Modalidade não informada'} · {value} · "\n                f"{_datetime_text(row.get('closing_at'))}"\n            )\n            portal_text = portal if portal not in {"", "Não informado"} else "Não identificado"\n            st.caption(f"Onde participar: {portal_text} · Custo: {access['label']}")\n\n            current_decision = str(row.get("decision") or "")\n            default_action = "Vou participar" if current_decision == "Participar" else "Escolha uma opção"\n            options = ["Escolha uma opção", "Vou participar", "Não vou participar", "Descartar"]\n            action = st.selectbox(\n                "O que você vai fazer?", options, index=options.index(default_action),\n                key=f"list_action_{row['id']}",\n            )\n\n            parsed_certame = None\n            if row.get("certame_at"):\n                try:\n                    parsed_certame = datetime.fromisoformat(str(row.get("certame_at")).replace("Z", "+00:00"))\n                except (TypeError, ValueError):\n                    parsed_certame = None\n\n            certame_date = None\n            certame_time = None\n            if action == "Vou participar":\n                c1, c2 = st.columns(2)\n                certame_date = c1.date_input(\n                    "Dia do certame", value=parsed_certame.date() if parsed_certame else date.today(),\n                    key=f"list_certame_date_{row['id']}",\n                )\n                certame_time = c2.time_input(\n                    "Hora do certame",\n                    value=parsed_certame.time().replace(second=0, microsecond=0) if parsed_certame else time(9, 0),\n                    key=f"list_certame_time_{row['id']}",\n                )\n\n            b1, b2 = st.columns(2)\n            if b1.button("Salvar decisão", key=f"list_save_decision_{row['id']}", type="primary", width="stretch"):\n                if action == "Escolha uma opção":\n                    st.warning("Escolha se vai participar, não vai participar ou descartar.")\n                elif action == "Descartar":\n                    db.delete_opportunity(company_id, row["id"])\n                    st.rerun()\n                elif action == "Não vou participar":\n                    db.update_details(company_id, row["id"], decision="Não participar", certame_at=None)\n                    db.update_stage(company_id, row["id"], "Arquivada")\n                    st.success("Edital marcado como não participar.")\n                    st.rerun()\n                else:\n                    certame_at = datetime.combine(certame_date, certame_time).isoformat(timespec="minutes")\n                    db.update_details(company_id, row["id"], decision="Participar", certame_at=certame_at)\n                    db.update_stage(company_id, row["id"], "Decisão")\n                    st.success("Participação salva. O certame já aparece no Calendário.")\n                    st.rerun()\n\n            official = pncp_official_url(row.get("pncp_control_number"))\n            source_url = str(row.get("source_url") or "")\n            target = official or (source_url if source_url.startswith(("http://", "https://")) else "")\n            if target:\n                b2.link_button("Acessar edital", target, width="stretch")\n            else:\n                b2.button("Acessar edital", disabled=True, key=f"list_no_link_{row['id']}", width="stretch")\n\n\ndef preferences_page'''
          d, n = mylist_pattern.subn(mylist_replacement, d, count=1)
          if n != 1:
              raise SystemExit('Não foi possível substituir my_list_page')

          discovery_path.write_text(d, encoding='utf-8')

          # App principal: remove módulos futuros do menu e aplica visual neutro global.
          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          clean_brand = '''def apply_brand():\n    st.markdown("""\n        <style>\n        .stApp,[data-testid="stAppViewContainer"],[data-testid="stMain"]{background:#FFFFFF !important;color:#293746 !important;}\n        header[data-testid="stHeader"]{background:transparent !important;height:0 !important;}\n        [data-testid="stToolbar"],[data-testid="stDecoration"],#MainMenu{display:none !important;}\n        [data-testid="stAppViewContainer"] *{font-weight:400 !important;}\n        [data-testid="stSidebar"]{background:#FFFFFF !important;border-right:1px solid #E3E8ED !important;}\n        [data-testid="stSidebar"] *{color:#293746 !important;}\n        [data-testid="stSidebar"] > div:first-child{overflow-y:auto !important;overflow-x:hidden !important;max-height:100vh !important;}\n        @media(min-width:901px){[data-testid="stSidebar"],[data-testid="stSidebar"] > div:first-child{width:250px !important;min-width:250px !important;max-width:250px !important;}}\n        [data-testid="stSidebar"] .stButton button{width:100% !important;min-height:2.15rem !important;justify-content:flex-start !important;background:#FFFFFF !important;color:#293746 !important;border:1px solid #DCE3E8 !important;border-radius:8px !important;box-shadow:none !important;padding:.20rem .48rem !important;}\n        [data-testid="stSidebar"] .stButton button[kind="primary"]{background:#EDF3F4 !important;color:#293746 !important;border-color:#B9CDD0 !important;box-shadow:none !important;}\n        [data-testid="stSidebar"] .st-key-sidebar_logout button{justify-content:center !important;background:#F4F7F9 !important;}\n        [data-testid="stSidebar"] [data-testid="stCaptionContainer"]{margin-top:.18rem !important;margin-bottom:.04rem !important;}\n        [data-testid="stSidebar"] [data-testid="stImage"] img{max-width:190px !important;width:190px !important;margin:0 auto !important;display:block !important;}\n        .block-container{padding-top:1.1rem;padding-bottom:2rem;max-width:1240px;}\n        div[data-testid="stVerticalBlockBorderWrapper"],div[data-testid="stMetric"]{background:#FFFFFF !important;border-color:#DCE3E8 !important;box-shadow:none !important;}\n        [data-baseweb="input"],[data-baseweb="base-input"],[data-baseweb="select"] > div,textarea{background:#FFFFFF !important;color:#293746 !important;border-color:#CCD6DD !important;box-shadow:none !important;}\n        input,textarea{background:#FFFFFF !important;color:#293746 !important;-webkit-text-fill-color:#293746 !important;}\n        .stButton>button,.stDownloadButton>button{background:#FFFFFF !important;color:#293746 !important;border:1px solid #CCD6DD !important;box-shadow:none !important;}\n        .stButton>button[kind="primary"],.stDownloadButton>button[kind="primary"]{background:#EAF2F3 !important;color:#293746 !important;border-color:#ADC6C9 !important;}\n        .brand-mark{font-size:2.1rem;color:#293746;line-height:1}.brand-mark span{color:#5F858A}.brand-tagline{color:#667786;margin-top:.45rem;margin-bottom:1.4rem}\n        @media(max-width:768px){.block-container{padding-top:.55rem;padding-left:.7rem;padding-right:.7rem}.stButton button,.stDownloadButton button{min-height:2.55rem;}}\n        </style>\n    """, unsafe_allow_html=True)\n'''
          app, n = re.subn(r'def apply_brand\(\):\n.*?\n\n\ndef brand_header', clean_brand + '\n\ndef brand_header', app, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível substituir apply_brand')

          app = app.replace(
              '''            work_pages = [\n                "❤️ Minha lista", "📋 Meus Editais", "📄 Analisar Edital",\n                "🏢 Minha Empresa", "📅 Calendário",\n            ]''',
              '''            work_pages = ["❤️ Minha lista", "📅 Calendário"]''',
              1,
          )
          app = app.replace(
              '''            guide_page = {\n                "🔎 Buscar licitações": "🔎 Buscar Editais",\n                "📋 Meus Editais": "⭐ Meus Editais",\n            }.get(page, page)\n            if guide_page in {\n                "📅 Calendário", "🔎 Buscar Editais", "⭐ Meus Editais",\n                "📄 Analisar Edital", "🏢 Minha Empresa", "💬 Suporte", "👤 Minha Conta",\n            }:''',
              '''            guide_page = {"🔎 Buscar licitações": "🔎 Buscar Editais"}.get(page, page)\n            if guide_page in {"📅 Calendário", "🔎 Buscar Editais", "💬 Suporte", "👤 Minha Conta"}:''',
              1,
          )
          app = app.replace(
              '''    elif page == "❤️ Minha lista":\n        essential_my_list_page(db, user)\n    elif page == "📋 Meus Editais":\n        pipeline_page(db, user)\n    elif page == "📄 Analisar Edital":\n        analysis_page(db, user, usage)\n    elif page == "🏢 Minha Empresa":\n        company_page(db, user)\n    elif page == "📅 Calendário":''',
              '''    elif page == "❤️ Minha lista":\n        essential_my_list_page(db, user)\n    elif page == "📅 Calendário":''',
              1,
          )
          app = app.replace(
              'st.markdown(f\'<div style="color:#10243F;font-weight:850">LicitaNexo · {APP_VERSION}</div>\', unsafe_allow_html=True)',
              'st.markdown(f\'<div style="color:#293746">LicitaNexo · {APP_VERSION}</div>\', unsafe_allow_html=True)',
              1,
          )
          app = app.replace(
              'Nenhum certame agendado. Em Meus Editais, informe a data do certame para que ele apareça aqui.',
              'Nenhum certame agendado. Na Minha lista, escolha Vou participar e informe o dia e a hora do certame.',
              1,
          )

          calendar_override = '''    st.markdown(\n        """<style>\n        .calendar-title,.agenda-head h3,.notes-panel-title{color:#293746 !important;font-weight:400 !important;}\n        .calendar-subtitle,.agenda-head span,.notes-panel-sub{color:#667786 !important;}\n        .month-card,.agenda-card,.date-badge{background:#FFFFFF !important;border-color:#DCE3E8 !important;box-shadow:none !important;color:#293746 !important;}\n        .month-name,.month-count,.weekdays,.day,.agenda-agency,.agenda-object,.agenda-meta,.date-badge strong,.date-badge small{color:#293746 !important;font-weight:400 !important;}\n        .month-count{background:#F4F7F9 !important;border-color:#DCE3E8 !important;}\n        .day.event{background:#EAF2F3 !important;color:#293746 !important;box-shadow:none !important;}\n        .day.today{outline:1px solid #9FB4BA !important;}\n        </style>""",\n        unsafe_allow_html=True,\n    )\n'''
          anchor = '    st.markdown(\'<div class="calendar-title">Calendário de certames</div>\', unsafe_allow_html=True)\n'
          if anchor not in app:
              raise SystemExit('Âncora do calendário não encontrada')
          app = app.replace(anchor, calendar_override + anchor, 1)
          app_path.write_text(app, encoding='utf-8')

          # Atualiza contrato antigo da RC31.6 para a versão atual.
          old_test_path = Path('tests/test_rc31_6_essential.py')
          old_test = old_test_path.read_text(encoding='utf-8')
          old_test = old_test.replace('APP_VERSION = "1.0 Essential RC31.6"', 'APP_VERSION = "1.0 Essential RC31.8"')
          old_test_path.write_text(old_test, encoding='utf-8')

          Path('tests/test_rc31_8_clean_essential.py').write_text('''from pathlib import Path\nimport tempfile\nimport unittest\n\nfrom src.database import Database\nfrom src.sources import portal_access_info\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass CleanEssentialContracts(unittest.TestCase):\n    def test_light_theme_has_no_gold_or_dark_background(self):\n        theme = (ROOT / ".streamlit" / "config.toml").read_text(encoding="utf-8")\n        self.assertIn('backgroundColor = "#FFFFFF"', theme)\n        self.assertIn('secondaryBackgroundColor = "#F4F7F9"', theme)\n        self.assertNotIn("#C99A2E", theme)\n        self.assertNotIn("#081321", theme)\n\n    def test_beginner_navigation_hides_future_modules(self):\n        app = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertIn('work_pages = ["❤️ Minha lista", "📅 Calendário"]', app)\n        self.assertIn('elif page == "📅 Calendário"', app)\n\n    def test_search_can_filter_dispute_site(self):\n        discovery = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        self.assertIn("Site da disputa", discovery)\n        self.assertIn("Todos os sites", discovery)\n        self.assertIn("PORTAL_SEARCH_TERMS", discovery)\n        self.assertIn("portal_terms=PORTAL_SEARCH_TERMS.get(portal)", discovery)\n\n    def test_all_state_flags_are_bundled(self):\n        states = "ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to".split()\n        for state in states:\n            self.assertTrue((ROOT / "assets" / "state_flags" / f"{state}.svg").exists(), state)\n\n    def test_unknown_portal_uses_simple_text(self):\n        info = portal_access_info("Não identificado")\n        self.assertEqual(info["label"], "Não identificado")\n        self.assertEqual(info["detail"], "Consultar edital.")\n\n    def test_calendar_only_includes_participation_decision(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            db = Database(Path(tmp) / "licitaflow.db")\n            user = db.register("Empresa", "Pessoa", "pessoa@example.com", "SenhaForte123!")\n            company_id = user["company_id"]\n            oid = db.add_manual_opportunity(company_id, "Órgão", "Objeto", certame_at="2099-01-10T09:00")\n            self.assertEqual(db.essential_certame_calendar(company_id, "2099-01-01"), [])\n            db.update_details(company_id, oid, decision="Participar", certame_at="2099-01-10T09:00")\n            rows = db.essential_certame_calendar(company_id, "2099-01-01")\n            self.assertEqual(len(rows), 1)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Compile
        run: python -m compileall -q app.py src tests

      - name: Full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit validated patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .streamlit/config.toml app.py src/config.py src/sources.py src/database.py src/essential_discovery.py assets/state_flags tests/test_rc31_6_essential.py tests/test_rc31_8_clean_essential.py
          git rm .github/workflows/rc31-8-clean-essential-patch.yml
          git commit -m "feat: simplificar Essential com busca clara e decisões rápidas"
          git push origin HEAD:agent/rc31-8-clean-essential
