name: RC31.13 Bootstrap Premium UI

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  materialize-source:
    if: github.head_ref == 'feat/rc31-13-premium-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout RC31.13 source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/rc31-13-premium-ui

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize premium UI into source files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rc31_12_patch.py
          python - <<'PY'
          from pathlib import Path

          # Promote the materialized source from the abandoned RC31.12 label to
          # the clean RC31.13 release. Keep the change scoped to runtime/tests/docs.
          targets = [
              Path('app.py'),
              Path('src/essential_discovery.py'),
              Path('src/config.py'),
              *Path('tests').glob('test_rc31_*.py'),
          ]
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').replace('RC31.12', 'RC31.13')
              path.write_text(text, encoding='utf-8')

          old_test = Path('tests/test_rc31_12_premium_ui.py')
          new_test = Path('tests/test_rc31_13_premium_ui.py')
          if old_test.exists():
              old_test.replace(new_test)
              new_test.write_text(new_test.read_text(encoding='utf-8').replace('RC31.12', 'RC31.13'), encoding='utf-8')

          old_doc = Path('docs/rc31-12-premium-ui.md')
          new_doc = Path('docs/rc31-13-premium-ui.md')
          if old_doc.exists():
              old_doc.replace(new_doc)
              new_doc.write_text(new_doc.read_text(encoding='utf-8').replace('RC31.12', 'RC31.13'), encoding='utf-8')

          app = Path('app.py').read_text(encoding='utf-8')
          discovery = Path('src/essential_discovery.py').read_text(encoding='utf-8')
          config = Path('src/config.py').read_text(encoding='utf-8')

          required = {
              'app.py': [
                  '--ln-navy:#0B2944',
                  'ln-login-eyebrow',
                  'MINHA CONTA',
              ],
              'src/essential_discovery.py': [
                  'ln-home-count',
                  'Descubra o que o governo está comprando.',
                  'font-family:Inter',
              ],
              'src/config.py': [
                  'APP_VERSION = "1.0 Essential RC31.13"',
              ],
          }
          contents = {
              'app.py': app,
              'src/essential_discovery.py': discovery,
              'src/config.py': config,
          }
          missing = [
              f'{path}: {marker}'
              for path, markers in required.items()
              for marker in markers
              if marker not in contents[path]
          ]
          if missing:
              raise SystemExit('RC31.13 materialization incomplete: ' + ', '.join(missing))
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py src/essential_discovery.py src/config.py

      - name: Remove obsolete code generators
        shell: bash
        run: |
          rm -f .github/workflows/rc31-12-premium-ui.yml
          rm -f scripts/rc31_12_patch.py
          rm -f .github/workflows/rc31-13-bootstrap.yml

      - name: Commit materialized RC31.13 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No RC31.13 changes generated"; exit 1; }
          git commit -m "feat: materialize premium UI RC31.13"
          git push origin HEAD:feat/rc31-13-premium-ui
