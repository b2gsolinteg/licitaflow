name: RC31.2 Dossier Patch

on:
  push:
    branches:
      - agent/dossie-exportacao-rc31-2

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dossie-exportacao-rc31-2
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply deterministic patch
        run: python scripts/patch_dossier_rc31_2.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit RC31.2 and remove one-shot tooling
        run: |
          rm -f scripts/patch_dossier_rc31_2.py .github/workflows/rc31-2-dossier-patch.yml
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: adicionar dossie completo PDF e Excel por edital"
          git push origin HEAD:agent/dossie-exportacao-rc31-2
