name: RC31.15 Materialize Visual Balance

on:
  push:
    branches:
      - feat/rc31-15-visual-balance
    paths:
      - scripts/rc31_15_apply.py
      - .github/workflows/rc31-15-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc31-15-visual-balance
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.15 visual balance
        run: python scripts/rc31_15_apply.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite unit suite before commit
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Remove one-time materializer and commit real source
        run: |
          git rm .github/workflows/rc31-15-materialize.yml scripts/rc31_15_apply.py
          git add -A
          git config user.name "b2gsolinteg"
          git config user.email "b2gsolinteg@gmail.com"
          git commit -m "feat: equilibrar acabamento visual RC31.15"
          git push origin HEAD:feat/rc31-15-visual-balance
