name: RC31.3.1 Hotfix

on:
  push:
    branches:
      - hotfix/rc31-3-1-streamlit-import

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/rc31-3-1-streamlit-import
          fetch-depth: 0

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply hotfix
        run: python scripts/patch_rc31_3_1.py

      - name: Import smoke on production Python
        run: |
          python - <<'PY'
          import importlib
          import sys
          import src.config
          sys.modules.pop('src', None)
          importlib.import_module('src')
          module = importlib.import_module('src.help_guides')
          assert callable(module.render_sidebar_guides)
          print('PYTHON314_HELP_IMPORT=PASS')
          PY

      - name: Compile application
        run: python -m compileall -q app.py src tests

      - name: Run full SQLite suite
        run: python -m unittest discover -s tests -v

      - name: Commit validated hotfix
        run: |
          rm -f scripts/patch_rc31_3_1.py .github/workflows/rc31-3-1-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "hotfix: tornar guias PDF não bloqueantes no boot RC31.3.1"
          git push origin hotfix/rc31-3-1-streamlit-import
