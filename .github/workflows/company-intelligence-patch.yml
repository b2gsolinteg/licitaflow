name: Company Intelligence Patch

on:
  push:
    branches:
      - agent/company-intelligence-pricing
    paths:
      - .github/workflows/company-intelligence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-intelligence-pricing
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply deterministic patch
        run: python scripts/patch_company_intelligence.py

      - name: Compile changed application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit patched application and remove one-shot tooling
        run: |
          rm scripts/patch_company_intelligence.py
          rm .github/workflows/company-intelligence-patch.yml
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar perfil inteligente e mesa de precificacao"
          git push origin HEAD:agent/company-intelligence-pricing
