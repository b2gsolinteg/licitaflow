name: RC31.10 Modern Filters

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-10-modern-filters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Apply RC31.10 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/rc31_10_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '    end = source.index(f"\\n\\ndef {next_name}", start)\n    return source[:start] + replacement.rstrip() + source[end:]\n'
          new = '    end = source.index(f"def {next_name}", start)\n    return source[:start] + replacement.rstrip() + "\\n\\n" + source[end:]\n'
          if old not in s:
              raise SystemExit('replace_function helper anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/rc31_10_patch.py

          python - <<'PY'
          from pathlib import Path

          # Legacy contracts now validate the professional plain labels.
          p = Path('tests/test_rc31_6_essential.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.assertIn("❤️ Minha lista", app)', 'self.assertIn("Minha lista", app)')
          s = s.replace('self.assertIn("🗺️ Por Estado", app)', 'self.assertIn("Por Estado", app)')
          s = s.replace('self.assertIn("📡 Radar de licitações", app)', 'self.assertIn("Radar de licitações", app)')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_rc31_8_clean_essential.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.assertIn(\'work_pages = ["❤️ Minha lista", "📅 Calendário"]\', app)', 'self.assertIn(\'work_pages = ["Minha lista", "Calendário"]\', app)')
          s = s.replace('self.assertIn(\'elif page == "📅 Calendário"\', app)', 'self.assertIn(\'elif page == "Calendário"\', app)')
          p.write_text(s, encoding='utf-8')

          # Keep sidebar labels intentionally stronger while the main content remains light.
          p = Path('src/essential_discovery.py')
          s = p.read_text(encoding='utf-8')
          css = '[data-testid="stSidebar"] .stButton button{font-weight:600 !important;}\n'
          if css not in s:
              anchor = '.ln-home-count{font-size:1.55rem;color:#293746;margin:.25rem 0 .95rem;}\n'
              if anchor not in s:
                  raise SystemExit('sidebar bold anchor missing')
              s = s.replace(anchor, anchor + css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc31-10-modern-filters.yml scripts/rc31_10_patch.py
          git add app.py src/essential_discovery.py src/config.py tests docs/rc31-10-modern-filters.md
          git commit -m "feat: filtros por região tipo e SRP RC31.10"
          git push origin HEAD:agent/rc31-10-modern-filters
