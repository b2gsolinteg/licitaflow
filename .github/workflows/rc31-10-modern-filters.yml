name: RC31.10 Modern Filters

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-10-modern-filters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Apply RC31.10 patch
        run: python scripts/rc31_10_patch.py
      - name: Validate
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc31-10-modern-filters.yml .github/workflows/rc31-10-modern-filters-v2.yml scripts/rc31_10_patch.py
          git add app.py src/essential_discovery.py src/config.py tests docs/rc31-10-modern-filters.md
          git commit -m "feat: filtros por região tipo e SRP RC31.10"
          git push origin HEAD:agent/rc31-10-modern-filters
