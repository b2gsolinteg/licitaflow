name: RC31.10 Modern Filters

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-10-modern-filters
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.10 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- src/essential_discovery.py ----------
          p = Path('src/essential_discovery.py')
          s = p.read_text(encoding='utf-8')

          anchor = 'FLAGS_DIR = Path(__file__).resolve().parents[1] / "assets" / "state_flags"\n'
          if anchor not in s:
              raise SystemExit('flags anchor not found')
          constants = '''BRAZIL_REGIONS = {
              "Brasil inteiro": (),
              "Norte": ("AC", "AP", "AM", "PA", "RO", "RR", "TO"),
              "Nordeste": ("AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE"),
              "Centro-Oeste": ("DF", "GO", "MT", "MS"),
              "Sudeste": ("ES", "MG", "RJ", "SP"),
              "Sul": ("PR", "RS", "SC"),
          }
          REGION_OPTIONS = tuple(BRAZIL_REGIONS.keys())
          NATURE_OPTIONS = ("Todos", "Produtos", "Serviços")
          SRP_OPTIONS = ("Todos", "Com registro de preços", "Sem registro de preços")
          '''
          s = s.replace(anchor, constants + anchor, 1)

          helper_anchor = '\ndef _criteria(**updates) -> dict:\n'
          if helper_anchor not in s:
              raise SystemExit('criteria marker not found')
          helpers = '''
          SERVICE_TERMS = (
              "serviço", "servicos", "serviços", "prestação de serviço", "prestacao de servico",
              "manutenção", "manutencao", "locação", "locacao", "consultoria", "engenharia",
              "obra", "reforma", "limpeza", "vigilância", "vigilancia", "instalação", "instalacao",
              "suporte técnico", "suporte tecnico", "capacitação", "capacitacao", "transporte",
              "terceirização", "terceirizacao", "mão de obra", "mao de obra", "seguro", "apólice", "apolice",
          )
          PRODUCT_TERMS = (
              "aquisição", "aquisicao", "compra", "fornecimento", "material", "materiais", "medicamento",
              "equipamento", "produto", "insumo", "gênero alimentício", "genero alimenticio", "mobiliário",
              "mobiliario", "uniforme", "peça", "peca",
          )


          def _opportunity_nature(item: dict) -> str:
              """Classificação conservadora a partir do objeto publicado no catálogo."""
              text = " ".join(str(item.get("object") or "").lower().split())
              service_anchors = (
                  "prestação de serviço", "prestacao de servico", "prestação dos serviços", "prestacao dos servicos",
                  "contratação de serviço", "contratacao de servico", "serviços de ", "servicos de ",
                  "mão de obra", "mao de obra", "seguro", "apólice", "apolice", "manutenção", "manutencao",
                  "locação", "locacao", "consultoria", "terceirização", "terceirizacao", "vigilância", "vigilancia",
                  "limpeza", "capacitação", "capacitacao", "obra", "reforma",
              )
              product_anchors = (
                  "aquisição de ", "aquisicao de ", "compra de ", "registro de preços para aquisição",
                  "registro de precos para aquisicao", "fornecimento de materiais", "fornecimento de medicamentos",
                  "fornecimento de equipamentos", "fornecimento de produtos", "fornecimento de insumos",
                  "fornecimento de mobiliário", "fornecimento de mobiliario", "fornecimento de uniformes",
              )
              explicit_service = any(term in text for term in service_anchors)
              explicit_product = any(term in text for term in product_anchors)
              if explicit_service and not explicit_product:
                  return "Serviços"
              if explicit_product and not explicit_service:
                  return "Produtos"
              if explicit_service and explicit_product:
                  return "Produtos e serviços"
              service = any(term in text for term in SERVICE_TERMS)
              product = any(term in text for term in PRODUCT_TERMS)
              if service and not product:
                  return "Serviços"
              if product and not service:
                  return "Produtos"
              if service and product:
                  return "Produtos e serviços"
              return "Não classificado"


          def _nature_matches(item: dict, wanted: str) -> bool:
              if wanted == "Todos":
                  return True
              nature = _opportunity_nature(item)
              if wanted == "Produtos":
                  return nature in {"Produtos", "Produtos e serviços"}
              if wanted == "Serviços":
                  return nature in {"Serviços", "Produtos e serviços"}
              return True


          def _effective_states(criteria: dict) -> list[str]:
              selected = [state for state in list(criteria.get("states") or []) if state in BRAZIL_STATES]
              region = str(criteria.get("region") or "Brasil inteiro")
              region_states = list(BRAZIL_REGIONS.get(region) or ())
              if not region_states:
                  return selected
              if not selected:
                  return region_states
              return [state for state in selected if state in region_states]


          def _srp_query_value(label: str):
              if label == "Com registro de preços":
                  return True
              if label == "Sem registro de preços":
                  return False
              return None


          def _srp_profile_value(label: str) -> str:
              if label == "Com registro de preços":
                  return "Sim"
              if label == "Sem registro de preços":
                  return "Não"
              return "Todos"

          '''
          s = s.replace(helper_anchor, '\n' + helpers + helper_anchor, 1)

          s = s.replace(
              '        "keyword": "",\n        "city": "",\n        "states": [],\n',
              '        "keyword": "",\n        "city": "",\n        "region": "Brasil inteiro",\n        "states": [],\n        "nature": "Todos",\n        "srp": "Todos",\n',
              1,
          )

          old_defaults = '''    return {
              "keyword": str(profile.get("search_keyword") or ""),
              "states": states,
              "modalities": modalities,
              "minimum": profile.get("search_minimum"),
              "maximum": profile.get("search_maximum"),
          }
          '''
          new_defaults = '''    saved_nature = str(profile.get("search_nature") or "Todos")
              if saved_nature not in NATURE_OPTIONS:
                  saved_nature = "Todos"
              saved_srp = str(profile.get("search_srp") or "Todos")
              saved_srp = {"Sim": "Com registro de preços", "Não": "Sem registro de preços"}.get(saved_srp, saved_srp)
              if saved_srp not in SRP_OPTIONS:
                  saved_srp = "Todos"
              return {
                  "keyword": str(profile.get("search_keyword") or ""),
                  "states": states,
                  "modalities": modalities,
                  "nature": saved_nature,
                  "srp": saved_srp,
                  "minimum": profile.get("search_minimum"),
                  "maximum": profile.get("search_maximum"),
              }
          '''
          if old_defaults not in s:
              raise SystemExit('profile defaults anchor not found')
          s = s.replace(old_defaults, new_defaults, 1)

          start = s.index('def _query_catalog(db, criteria: dict, *, limit: int = 10000) -> list[dict]:')
          end = s.index('\n\ndef _save_to_list', start)
          query_fn = '''def _query_catalog(db, criteria: dict, *, limit: int = 10000) -> list[dict]:
              cities = [str(criteria.get("city") or "").strip()] if str(criteria.get("city") or "").strip() else []
              portal = str(criteria.get("portal") or "Todos os sites")
              items = db.list_global_catalog(
                  search=str(criteria.get("keyword") or "").strip(),
                  states=_effective_states(criteria),
                  cities=cities,
                  modalities=list(criteria.get("modalities") or []),
                  srp=_srp_query_value(str(criteria.get("srp") or "Todos")),
                  minimum=criteria.get("minimum"),
                  maximum=criteria.get("maximum"),
                  closing_from=criteria.get("closing_from") or date.today().isoformat(),
                  closing_to=criteria.get("closing_to"),
                  limit=limit,
                  order_by=str(criteria.get("order") or "recent"),
                  portal_terms=PORTAL_SEARCH_TERMS.get(portal),
              )
              nature = str(criteria.get("nature") or "Todos")
              if nature != "Todos":
                  items = [item for item in items if _nature_matches(item, nature)]
              return items
          '''
          s = s[:start] + query_fn + s[end:]

          # Search page: compact, direct and with region/type/SRP.
          start = s.index('def search_page(db, user: dict, usage=None) -> None:')
          end = s.index('\n\ndef state_page', start)
          search_fn = '''def search_page(db, user: dict, usage=None) -> None:
              _apply_styles()
              company_id = user["company_id"]
              defaults = _profile_defaults(db, company_id)
              current = st.session_state.get("essential_search_criteria") or {}

              st.markdown('<div class="ln-discovery-title">Buscar licitações</div>', unsafe_allow_html=True)
              st.markdown('<div class="ln-discovery-sub">Escolha só o que fizer sentido. Campos vazios deixam a busca mais ampla.</div>', unsafe_allow_html=True)

              with st.form("essential_quick_search", clear_on_submit=False, enter_to_submit=False):
                  keyword = st.text_input(
                      "O que você procura?",
                      value=str(current.get("keyword") if "keyword" in current else defaults["keyword"]),
                      placeholder="Ex.: papel A4, pneus, medicamentos, manutenção...",
                  )

                  g1, g2, g3 = st.columns([1, 1.2, 1.2])
                  current_region = str(current.get("region") or "Brasil inteiro")
                  region_index = REGION_OPTIONS.index(current_region) if current_region in REGION_OPTIONS else 0
                  region = g1.selectbox("Região", REGION_OPTIONS, index=region_index)
                  states = g2.multiselect(
                      "Estado (opcional)", list(BRAZIL_STATES),
                      default=list(current.get("states") if "states" in current else defaults["states"]),
                      placeholder="Todos da região",
                  )
                  city = g3.text_input("Cidade (opcional)", value=str(current.get("city") or ""), placeholder="Ex.: Londrina")

                  f1, f2, f3 = st.columns(3)
                  current_nature = str(current.get("nature") if "nature" in current else defaults["nature"])
                  nature_index = NATURE_OPTIONS.index(current_nature) if current_nature in NATURE_OPTIONS else 0
                  nature = f1.selectbox("O que procura", NATURE_OPTIONS, index=nature_index)
                  current_srp = str(current.get("srp") if "srp" in current else defaults["srp"])
                  srp_index = SRP_OPTIONS.index(current_srp) if current_srp in SRP_OPTIONS else 0
                  srp = f2.selectbox("Registro de preços", SRP_OPTIONS, index=srp_index)
                  current_portal = str(current.get("portal") or "Todos os sites")
                  portal_index = PORTAL_OPTIONS.index(current_portal) if current_portal in PORTAL_OPTIONS else 0
                  portal = f3.selectbox("Site da disputa", PORTAL_OPTIONS, index=portal_index)

                  modalities = st.multiselect(
                      "Modalidade", list(MODALITIES.keys()),
                      default=list(current.get("modalities") if "modalities" in current else defaults["modalities"]),
                      placeholder="Todas",
                  )
                  v1, v2 = st.columns(2)
                  min_default = current.get("minimum") if "minimum" in current else defaults["minimum"]
                  max_default = current.get("maximum") if "maximum" in current else defaults["maximum"]
                  minimum_text = v1.text_input("Valor mínimo", value="" if min_default in (None, "") else str(min_default), placeholder="Sem mínimo")
                  maximum_text = v2.text_input("Valor máximo", value="" if max_default in (None, "") else str(max_default), placeholder="Sem máximo")
                  submitted = st.form_submit_button("Buscar licitações", type="primary", width="stretch")

              if submitted:
                  minimum = parse_brl(minimum_text) if minimum_text.strip() else None
                  maximum = parse_brl(maximum_text) if maximum_text.strip() else None
                  if minimum_text.strip() and minimum is None:
                      st.error("Confira o valor mínimo digitado.")
                      return
                  if maximum_text.strip() and maximum is None:
                      st.error("Confira o valor máximo digitado.")
                      return
                  current = _criteria(
                      keyword=keyword.strip(), city=city.strip(), region=region, states=states,
                      nature=nature, srp=srp, modalities=modalities,
                      minimum=minimum, maximum=maximum, portal=portal,
                  )
                  st.session_state["essential_search_criteria"] = current
                  st.session_state["essential_search_page"] = 1
                  if usage is not None:
                      usage.record_search(company_id, user.get("id", ""), keyword.strip())
                  db.save_company_profile(
                      company_id,
                      search_keyword=keyword.strip(), search_nature=nature,
                      service_states=", ".join(states), search_modalities="|".join(modalities),
                      search_srp=_srp_profile_value(srp), search_minimum=minimum, search_maximum=maximum,
                      search_order="Mais recentes",
                  )

              if not current:
                  st.info("Digite uma palavra ou escolha um filtro para começar.")
                  return

              effective_states = _effective_states(current)
              if str(current.get("region") or "Brasil inteiro") != "Brasil inteiro":
                  st.caption(f"Região: {current['region']} · UFs consideradas: {', '.join(effective_states) or 'nenhuma'}")
              with st.spinner("Buscando editais abertos..."):
                  items = _query_catalog(db, current)
              st.markdown("### Editais abertos para participação")
              _render_results(db, user, items, page_key="essential_search_page", per_page=6)
          '''
          s = s[:start] + search_fn + s[end:]

          # Advanced search receives the same core choices.
          start = s.index('def advanced_search_page(db, user: dict) -> None:')
          end = s.index('\n\ndef top50_page', start)
          advanced_fn = '''def advanced_search_page(db, user: dict) -> None:
              _apply_styles()
              st.markdown('<div class="ln-discovery-title">Filtro avançado</div>', unsafe_allow_html=True)
              st.markdown('<div class="ln-discovery-sub">Combine os filtros que quiser. Nenhum campo é obrigatório.</div>', unsafe_allow_html=True)
              with st.form("essential_advanced_search", clear_on_submit=False, enter_to_submit=False):
                  r1, r2 = st.columns(2)
                  region = r1.selectbox("Região", REGION_OPTIONS)
                  states = r2.multiselect("Estados", list(BRAZIL_STATES), placeholder="Todos da região")
                  city = st.text_input("Cidade", placeholder="Opcional")
                  c1, c2, c3 = st.columns(3)
                  nature = c1.selectbox("O que procura", NATURE_OPTIONS)
                  srp = c2.selectbox("Registro de preços", SRP_OPTIONS)
                  portal = c3.selectbox("Site da disputa", PORTAL_OPTIONS)
                  modalities = st.multiselect("Modalidades", list(MODALITIES.keys()), placeholder="Todas")
                  keyword = st.text_input("O que você procura?", placeholder="Ex.: material de limpeza")
                  v1, v2 = st.columns(2)
                  minimum_text = v1.text_input("Valor mínimo", placeholder="Sem mínimo")
                  maximum_text = v2.text_input("Valor máximo", placeholder="Sem máximo")
                  d1, d2 = st.columns(2)
                  start_date = d1.date_input("Participação a partir de", value=date.today())
                  no_end = d2.checkbox("Sem data final", value=True)
                  end_date = d2.date_input("Participação até", value=date.today(), disabled=no_end)
                  if st.form_submit_button("Buscar licitações", type="primary", width="stretch"):
                      minimum = parse_brl(minimum_text) if minimum_text.strip() else None
                      maximum = parse_brl(maximum_text) if maximum_text.strip() else None
                      if minimum_text.strip() and minimum is None:
                          st.error("Confira o valor mínimo digitado.")
                      elif maximum_text.strip() and maximum is None:
                          st.error("Confira o valor máximo digitado.")
                      else:
                          st.session_state["essential_search_criteria"] = _criteria(
                              keyword=keyword.strip(), city=city.strip(), region=region, states=states,
                              nature=nature, srp=srp, modalities=modalities,
                              minimum=minimum, maximum=maximum, portal=portal,
                              closing_from=start_date.isoformat(), closing_to=None if no_end else end_date.isoformat(),
                          )
                          st.session_state["essential_search_page"] = 1
                          st.session_state["_navigation_request"] = "Buscar licitações"
                          st.rerun()
          '''
          s = s[:start] + advanced_fn + s[end:]

          # Route/display names without playful emojis.
          replacements = {
              '🏠 Início': 'Início',
              '🔎 Buscar licitações': 'Buscar licitações',
              '🗺️ Por Estado': 'Por Estado',
              '📍 Por Cidade': 'Por Cidade',
              '☰ Por Modalidade': 'Por Modalidade',
              '🌐 Por site de disputa': 'Por site de disputa',
              '⚙️ Filtro avançado': 'Filtro avançado',
              '🔥 Em destaque': 'Em destaque',
              '❤️ Minha lista': 'Minha lista',
              '🔔 Preferências': 'Preferências',
              '📡 Radar de licitações': 'Radar de licitações',
              '📦 Itens da licitação': 'Itens da licitação',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Home shortcuts use professional Material Symbols.
          old_shortcuts = '''    shortcuts = [
                  ("Por Estado", "Ver estados"),
                  ("Por Cidade", "Buscar cidade"),
                  ("Por Modalidade", "Ver modalidades"),
                  ("Por site de disputa", "Ver sites"),
              ]
              cols = st.columns(4)
              for col, (target, label) in zip(cols, shortcuts):
                  if col.button(label, key=f"home_{target}", width="stretch"):
          '''
          new_shortcuts = '''    shortcuts = [
                  ("Por Estado", "Por Estado", ":material/map:"),
                  ("Por Cidade", "Por Cidade", ":material/location_on:"),
                  ("Por Modalidade", "Por Modalidade", ":material/category:"),
                  ("Por site de disputa", "Por site", ":material/language:"),
              ]
              cols = st.columns(4)
              for col, (target, label, icon) in zip(cols, shortcuts):
                  if col.button(label, icon=icon, key=f"home_{target}", width="stretch"):
          '''
          if old_shortcuts in s:
              s = s.replace(old_shortcuts, new_shortcuts, 1)

          # Slightly more contemporary, still neutral/light.
          s = s.replace(
              '[data-testid="stMain"] div[data-testid="stVerticalBlockBorderWrapper"]{background:#FFFFFF !important;border-color:#DCE3E8 !important;box-shadow:none !important;}',
              '[data-testid="stMain"] div[data-testid="stVerticalBlockBorderWrapper"]{background:#FFFFFF !important;border:1px solid #E1E7EC !important;border-radius:14px !important;box-shadow:0 1px 2px rgba(25,39,52,.04) !important;}',
              1,
          )
          s = s.replace(
              '[data-testid="stMain"] .stButton button,[data-testid="stMain"] .stDownloadButton button{background:#FFFFFF !important;color:#293746 !important;border:1px solid #CCD6DD !important;box-shadow:none !important;}',
              '[data-testid="stMain"] .stButton button,[data-testid="stMain"] .stDownloadButton button{background:#FFFFFF !important;color:#293746 !important;border:1px solid #D2DBE2 !important;border-radius:10px !important;box-shadow:none !important;}',
              1,
          )
          s = s.replace('.ln-state-card{min-height:154px;}', '.ln-state-card{min-height:160px;}')

          p.write_text(s, encoding='utf-8')

          # ---------- app.py ----------
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          nav_replacements = {
              '🏠 Início': 'Início',
              '🔎 Buscar licitações': 'Buscar licitações',
              '🗺️ Por Estado': 'Por Estado',
              '📍 Por Cidade': 'Por Cidade',
              '☰ Por Modalidade': 'Por Modalidade',
              '🌐 Por site de disputa': 'Por site de disputa',
              '⚙️ Filtro avançado': 'Filtro avançado',
              '🔥 Em destaque': 'Em destaque',
              '❤️ Minha lista': 'Minha lista',
              '📅 Calendário': 'Calendário',
              '🔔 Preferências': 'Preferências',
              '📡 Radar de licitações': 'Radar de licitações',
              '💬 Suporte': 'Suporte',
              '👤 Minha Conta': 'Minha conta',
          }
          for old, new in nav_replacements.items():
              s = s.replace(old, new)

          s = s.replace('f\'<div style="font-weight:400;color:#172033">{_greeting(user)} 👋</div>\'', 'f\'<div style="font-weight:400;color:#172033">{_greeting(user)}</div>\'', 1)
          s = s.replace('st.markdown("## 🛡️ LicitaNexo")', 'st.markdown("## LicitaNexo")', 1)

          marker = '            def _nav_group(title, options, group_key):\n'
          if marker not in s:
              raise SystemExit('nav group marker not found')
          icon_map = '''            nav_icons = {
                  "Início": ":material/home:",
                  "Buscar licitações": ":material/search:",
                  "Por Estado": ":material/map:",
                  "Por Cidade": ":material/location_on:",
                  "Por Modalidade": ":material/category:",
                  "Por site de disputa": ":material/language:",
                  "Filtro avançado": ":material/filter_alt:",
                  "Em destaque": ":material/trending_up:",
                  "Minha lista": ":material/bookmarks:",
                  "Calendário": ":material/calendar_month:",
                  "Preferências": ":material/tune:",
                  "Radar de licitações": ":material/notifications_active:",
                  "Suporte": ":material/help_center:",
                  "Minha conta": ":material/account_circle:",
              }

          '''
          s = s.replace(marker, icon_map + marker, 1)
          s = s.replace(
              '                        option, key=f"nav_{group_key}_{index}",\n                        type="primary" if selected else "secondary", width="stretch",',
              '                        option, icon=nav_icons.get(option), key=f"nav_{group_key}_{index}",\n                        type="primary" if selected else "secondary", width="stretch",',
              1,
          )
          s = s.replace(
              '        if st.button("↪ Sair", key="sidebar_logout", width="stretch"):',
              '        if st.button("Sair", icon=":material/logout:", key="sidebar_logout", width="stretch"):',
              1,
          )

          # Guides still receive the established internal screen keys.
          old_guide = '            guide_page = {"Buscar licitações": "🔎 Buscar Editais"}.get(page, page)\n            if guide_page in {"Calendário", "🔎 Buscar Editais", "Suporte", "Minha conta"}:\n'
          new_guide = '            guide_page = {"Buscar licitações": "🔎 Buscar Editais", "Calendário": "📅 Calendário", "Suporte": "💬 Suporte", "Minha conta": "👤 Minha Conta"}.get(page, page)\n            if guide_page in {"📅 Calendário", "🔎 Buscar Editais", "💬 Suporte", "👤 Minha Conta"}:\n'
          if old_guide in s:
              s = s.replace(old_guide, new_guide, 1)

          # Flat sidebar and restrained cards/inputs.
          old_sidebar_css = '[data-testid="stSidebar"] .stButton button{width:100% !important;min-height:2.15rem !important;justify-content:flex-start !important;background:#FFFFFF !important;color:#293746 !important;border:1px solid #DCE3E8 !important;border-radius:8px !important;box-shadow:none !important;padding:.20rem .48rem !important;}'
          new_sidebar_css = '[data-testid="stSidebar"] .stButton button{width:100% !important;min-height:2.25rem !important;justify-content:flex-start !important;background:transparent !important;color:#293746 !important;border:1px solid transparent !important;border-radius:10px !important;box-shadow:none !important;padding:.28rem .52rem !important;gap:.38rem !important;}'
          if old_sidebar_css not in s:
              raise SystemExit('sidebar css anchor not found')
          s = s.replace(old_sidebar_css, new_sidebar_css, 1)
          s = s.replace(
              '[data-testid="stSidebar"] .stButton button[kind="primary"]{background:#EDF3F4 !important;color:#293746 !important;border-color:#B9CDD0 !important;box-shadow:none !important;}',
              '[data-testid="stSidebar"] .stButton button[kind="primary"]{background:#F0F4F5 !important;color:#243746 !important;border-color:#E1E8EC !important;box-shadow:none !important;}',
              1,
          )
          s = s.replace(
              'div[data-testid="stVerticalBlockBorderWrapper"],div[data-testid="stMetric"]{background:#FFFFFF !important;border-color:#DCE3E8 !important;box-shadow:none !important;}',
              'div[data-testid="stVerticalBlockBorderWrapper"],div[data-testid="stMetric"]{background:#FFFFFF !important;border-color:#E1E7EC !important;border-radius:14px !important;box-shadow:0 1px 2px rgba(25,39,52,.035) !important;}',
              1,
          )
          s = s.replace(
              '[data-baseweb="input"],[data-baseweb="base-input"],[data-baseweb="select"] > div,textarea{background:#FFFFFF !important;color:#293746 !important;border-color:#CCD6DD !important;box-shadow:none !important;}',
              '[data-baseweb="input"],[data-baseweb="base-input"],[data-baseweb="select"] > div,textarea{background:#FFFFFF !important;color:#293746 !important;border-color:#D1DAE1 !important;border-radius:10px !important;box-shadow:none !important;}',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # ---------- config ----------
          p = Path('src/config.py')
          s = p.read_text(encoding='utf-8')
          if 'APP_VERSION = "1.0 Essential RC31.9"' not in s:
              raise SystemExit('version anchor not found')
          s = s.replace('APP_VERSION = "1.0 Essential RC31.9"', 'APP_VERSION = "1.0 Essential RC31.10"', 1)
          p.write_text(s, encoding='utf-8')

          # ---------- existing version/menu contract tests ----------
          for test_path in Path('tests').glob('test_rc31_*.py'):
              t = test_path.read_text(encoding='utf-8')
              t = t.replace('APP_VERSION = "1.0 Essential RC31.9"', 'APP_VERSION = "1.0 Essential RC31.10"')
              t = t.replace('self.assertIn("🏠 Início", app)', 'self.assertIn("Início", app)')
              t = t.replace('self.assertIn("🌐 Por site de disputa", app)', 'self.assertIn("Por site de disputa", app)')
              t = t.replace('self.assertIn("🔥 Em destaque", app)', 'self.assertIn("Em destaque", app)')
              t = t.replace('self.assertNotIn(\'"🏆 Top 50"\', app)', 'self.assertNotIn(\'"🏆 Top 50"\', app)')
              test_path.write_text(t, encoding='utf-8')

          new_test = Path('tests/test_rc31_10_modern_filters.py')
          new_test.write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass ModernEssentialFilters(unittest.TestCase):\n    def test_region_type_and_srp_filters_exist(self):\n        src = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        self.assertIn('"Sul": ("PR", "RS", "SC")', src)\n        self.assertIn('"Sudeste": ("ES", "MG", "RJ", "SP")', src)\n        self.assertIn('NATURE_OPTIONS = ("Todos", "Produtos", "Serviços")', src)\n        self.assertIn('SRP_OPTIONS = ("Todos", "Com registro de preços", "Sem registro de preços")', src)\n        self.assertIn('srp=_srp_query_value', src)\n        self.assertIn('states=_effective_states(criteria)', src)\n\n    def test_navigation_uses_material_icons_and_plain_labels(self):\n        app = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertIn('"Minha lista": ":material/bookmarks:"', app)\n        self.assertIn('"Buscar licitações": ":material/search:"', app)\n        self.assertNotIn('"❤️ Minha lista"', app)\n        self.assertNotIn('"🔥 Em destaque"', app)\n\n    def test_version_is_rc3110(self):\n        cfg = (ROOT / "src" / "config.py").read_text(encoding="utf-8")\n        self.assertIn('APP_VERSION = "1.0 Essential RC31.10"', cfg)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('docs/rc31-10-modern-filters.md').write_text('''# RC31.10 · filtros práticos e navegação moderna\n\n- Busca por região do Brasil, mantendo Estado e Cidade como refinamentos.\n- Filtro simples para Produtos ou Serviços.\n- Filtro para editais com ou sem registro de preços (SRP).\n- Navegação do usuário com Material Symbols e rótulos sem emojis decorativos.\n- Sidebar mais plana, cards e campos neutros, mantendo a interface clara e sem dourado/azul escuro.\n- Essential continua focado em descoberta, lista e calendário.\n- Sem migration e sem alteração de dados.\n''', encoding='utf-8')
          PY

      - name: Compile and run full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v

      - name: Commit validated patch and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc31-10-modern-filters.yml
          git add app.py src/essential_discovery.py src/config.py tests docs/rc31-10-modern-filters.md
          git commit -m "feat: filtros por região tipo e SRP RC31.10"
          git push origin HEAD:agent/rc31-10-modern-filters
