name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  sqlite-suite:
    name: SQLite · full suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile all Python modules
        run: python -m compileall -q app.py src scripts tests

      - name: Run complete unit suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

  postgres-integration:
    name: PostgreSQL 16 · migrations + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LICITANEXO_TEST_POSTGRES: "1"
      LICITANEXO_DB_BACKEND: postgres
      LICITANEXO_DB_SCHEMA: licitanexo_ci
      LICITANEXO_PGHOST: 127.0.0.1
      LICITANEXO_PGPORT: "5432"
      LICITANEXO_PGDATABASE: postgres
      LICITANEXO_PGUSER: postgres
      LICITANEXO_PGPASSWORD: postgres
      LICITANEXO_PGSSLMODE: disable
      LICITANEXO_PG_POOL_MIN: "1"
      LICITANEXO_PG_POOL_MAX: "3"
      LICITANEXO_SCHEMA_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile database modules
        run: python -m compileall -q src scripts tests/test_postgres_integration.py tests/test_postgres_company_intelligence.py

      - name: Run PostgreSQL integration suite
        run: python -m unittest discover -s tests -p 'test_postgres*.py' -v

      - name: Verify migration history and native types
        run: python scripts/check_postgres_schema.py
