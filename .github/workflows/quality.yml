name: RC31.8 Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-rc31-8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-8-clean-essential
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Execute RC31.8 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/rc31-8-clean-essential-patch.yml').read_text(encoding='utf-8')
          for target in ('Add Brazilian state flags', 'Apply clean Essential patch'):
              marker = f'      - name: {target}\n        run: |\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Etapa não encontrada: {target}')
              start += len(marker)
              end = text.find('\n      - name:', start)
              if end < 0:
                  end = len(text)
              raw = text[start:end]
              body = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
              subprocess.run(['bash', '-lc', body], check=True)
          PY
      - name: Compile and run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src tests
          python -m unittest discover -s tests -v
      - name: Restore normal quality workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality.yml
          git rm .github/workflows/rc31-8-clean-essential-patch.yml
          git add -A
          git commit -m "feat: simplificar Essential com busca clara e decisões rápidas"
          git push origin HEAD:agent/rc31-8-clean-essential
