name: RC31.9 Simple Discovery

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-9-simple-discovery
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.9 UX patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------------- essential_discovery.py ----------------
          p = Path('src/essential_discovery.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.ln-state-card{min-height:142px;}\n',
              '.ln-state-card{min-height:154px;}\n'
              '.ln-home-count{font-size:1.55rem;color:#293746;margin:.25rem 0 .95rem;}\n'
              '[data-testid="stSidebar"] .stButton button{font-weight:600 !important;}\n'
          )

          old_header = '''    control = str(item.get("pncp_control_number") or "").strip()\n    reference = control or "Contratação pública"\n    city = str(item.get("city") or "Município não informado")\n    state = str(item.get("state") or "--")\n    agency = str(item.get("agency") or "Órgão não informado")\n'''
          new_header = '''    control = str(item.get("pncp_control_number") or "").strip()\n    city = str(item.get("city") or "Município não informado")\n    state = str(item.get("state") or "--")\n    agency = str(item.get("agency") or "Órgão não informado")\n    reference = agency\n'''
          if old_header not in s:
              raise SystemExit('card header anchor not found')
          s = s.replace(old_header, new_header, 1)

          s = s.replace(
              '    opening_text = _datetime_text(opening)\n    countdown = _countdown(deadline)\n',
              '    opening_text = _datetime_text(opening)\n    published_text = _datetime_text(item.get("published_at"))\n    countdown = _countdown(deadline)\n',
              1,
          )

          old_grid = '''            '<div class="ln-info-grid">'\n            f'<div class="ln-info-box"><div class="ln-info-label">Cidade</div><div class="ln-info-value">{escape(city)} — {escape(state)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Órgão</div><div class="ln-info-value">{escape(agency)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Valor</div><div class="ln-info-value">{escape(value)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Data e prazo</div><div class="ln-info-value">{escape(opening_text)}</div>{extra}</div>'\n            '</div>', unsafe_allow_html=True,\n'''
          new_grid = '''            '<div class="ln-info-grid">'\n            f'<div class="ln-info-box"><div class="ln-info-label">Cidade</div><div class="ln-info-value">{escape(city)} — {escape(state)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Valor</div><div class="ln-info-value">{escape(value)}</div></div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Data e prazo</div><div class="ln-info-value">{escape(opening_text)}</div>{extra}</div>'\n            f'<div class="ln-info-box"><div class="ln-info-label">Publicado em</div><div class="ln-info-value">{escape(published_text)}</div></div>'\n            '</div>', unsafe_allow_html=True,\n'''
          if old_grid not in s:
              raise SystemExit('card grid anchor not found')
          s = s.replace(old_grid, new_grid, 1)

          s = s.replace('                    st.markdown(f"**{label}**")', '                    st.write(label)')
          s = s.replace('                    st.image(str(flag), width=62)', '                    st.image(str(flag), width=72)')
          s = s.replace('st.caption(f"{total:,} editais abertos".replace(",", "."))', 'st.caption(f"{total:,} editais abertos para participação".replace(",", "."))')

          marker = '\ndef search_page(db, user: dict, usage=None) -> None:\n'
          if marker not in s:
              raise SystemExit('search_page marker not found')
          addition = '''\ndef home_page(db, user: dict) -> None:\n    _apply_styles()\n    counts = db.global_catalog_group_counts("state", closing_from=date.today().isoformat())\n    open_total = sum(int(row.get("total") or 0) for row in counts)\n\n    st.markdown('<div class="ln-discovery-title">Encontre o que o governo está comprando</div>', unsafe_allow_html=True)\n    st.markdown('<div class="ln-discovery-sub">Você pode pesquisar um produto ou começar por estado, cidade, modalidade ou site da disputa.</div>', unsafe_allow_html=True)\n    st.markdown(f'<div class="ln-home-count">{open_total:,} editais abertos para participação</div>'.replace(",", "."), unsafe_allow_html=True)\n\n    with st.form("essential_home_search", clear_on_submit=False, enter_to_submit=False):\n        keyword = st.text_input("O que você procura?", placeholder="Ex.: papel A4, pneus, medicamentos, uniformes...")\n        if st.form_submit_button("Buscar licitações", type="primary", width="stretch"):\n            st.session_state["essential_search_criteria"] = _criteria(keyword=keyword.strip())\n            st.session_state["essential_search_page"] = 1\n            st.session_state["_navigation_request"] = "🔎 Buscar licitações"\n            st.rerun()\n\n    st.caption("Ou comece por uma destas opções:")\n    shortcuts = [\n        ("🗺️ Por Estado", "Ver estados"),\n        ("📍 Por Cidade", "Buscar cidade"),\n        ("☰ Por Modalidade", "Ver modalidades"),\n        ("🌐 Por site de disputa", "Ver sites"),\n    ]\n    cols = st.columns(4)\n    for col, (target, label) in zip(cols, shortcuts):\n        if col.button(label, key=f"home_{target}", width="stretch"):\n            st.session_state["_navigation_request"] = target\n            st.rerun()\n\n\ndef portal_page(db, user: dict) -> None:\n    _apply_styles()\n    st.markdown('<div class="ln-discovery-title">🌐 Por site de disputa</div>', unsafe_allow_html=True)\n    st.markdown('<div class="ln-discovery-sub">Escolha onde deseja participar. Se não tiver preferência, use Todos os sites.</div>', unsafe_allow_html=True)\n\n    if st.button("Todos os sites", key="portal_all", type="primary", width="stretch"):\n        st.session_state["essential_search_criteria"] = _criteria(portal="Todos os sites")\n        st.session_state["essential_search_page"] = 1\n        st.session_state["_navigation_request"] = "🔎 Buscar licitações"\n        st.rerun()\n\n    portals = list(PORTAL_ACCESS.keys())\n    for start in range(0, len(portals), 3):\n        cols = st.columns(3)\n        for col, portal in zip(cols, portals[start:start + 3]):\n            access = portal_access_info(portal)\n            with col.container(border=True):\n                st.write(portal)\n                st.caption(f"Custo do acesso: {access['label']}")\n                if st.button("Ver editais", key=f"portal_{portal}", width="stretch"):\n                    st.session_state["essential_search_criteria"] = _criteria(portal=portal)\n                    st.session_state["essential_search_page"] = 1\n                    st.session_state["_navigation_request"] = "🔎 Buscar licitações"\n                    st.rerun()\n\n'''
          s = s.replace(marker, addition + marker, 1)

          s = s.replace(
              "    st.markdown('<div class=\"ln-discovery-title\">🏆 Top 50</div>', unsafe_allow_html=True)\n    st.markdown('<div class=\"ln-discovery-sub\">50 editais abertos para você explorar agora.</div>', unsafe_allow_html=True)",
              "    st.markdown('<div class=\"ln-discovery-title\">🔥 Em destaque</div>', unsafe_allow_html=True)\n    st.markdown('<div class=\"ln-discovery-sub\">50 editais recentes para você explorar sem precisar definir uma busca.</div>', unsafe_allow_html=True)",
              1,
          )

          p.write_text(s, encoding='utf-8')

          # ---------------- app.py ----------------
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from src.essential_discovery import (\n    search_page as essential_search_page,',
              'from src.essential_discovery import (\n    home_page as essential_home_page,\n    search_page as essential_search_page,',
              1,
          )
          s = s.replace(
              '    modality_page as essential_modality_page,\n    advanced_search_page as essential_advanced_search_page,',
              '    modality_page as essential_modality_page,\n    portal_page as essential_portal_page,\n    advanced_search_page as essential_advanced_search_page,',
              1,
          )
          s = s.replace(
              '            explore_pages = [\n                "🔎 Buscar licitações", "🗺️ Por Estado", "📍 Por Cidade",\n                "☰ Por Modalidade", "⚙️ Filtro avançado", "🏆 Top 50",\n            ]',
              '            explore_pages = [\n                "🏠 Início", "🔎 Buscar licitações", "🗺️ Por Estado", "📍 Por Cidade",\n                "☰ Por Modalidade", "🌐 Por site de disputa", "⚙️ Filtro avançado", "🔥 Em destaque",\n            ]',
              1,
          )
          s = s.replace('f\'<div style="font-weight:850;color:#172033">{_greeting(user)} 👋</div>\'', 'f\'<div style="font-weight:400;color:#172033">{_greeting(user)} 👋</div>\'', 1)
          s = s.replace(
              '    if page == "🔎 Buscar licitações":\n        essential_search_page(db, user, usage)',
              '    if page == "🏠 Início":\n        essential_home_page(db, user)\n    elif page == "🔎 Buscar licitações":\n        essential_search_page(db, user, usage)',
              1,
          )
          s = s.replace(
              '    elif page == "☰ Por Modalidade":\n        essential_modality_page(db, user)\n    elif page == "⚙️ Filtro avançado":',
              '    elif page == "☰ Por Modalidade":\n        essential_modality_page(db, user)\n    elif page == "🌐 Por site de disputa":\n        essential_portal_page(db, user)\n    elif page == "⚙️ Filtro avançado":',
              1,
          )
          s = s.replace(
              '    elif page == "🏆 Top 50":\n        essential_top50_page(db, user)',
              '    elif page == "🔥 Em destaque":\n        essential_top50_page(db, user)',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # ---------------- config.py ----------------
          p = Path('src/config.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('APP_VERSION = "1.0 Essential RC31.8"', 'APP_VERSION = "1.0 Essential RC31.9"', 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- tests ----------------
          test = Path('tests/test_rc31_9_simple_discovery.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass SimpleDiscoveryContracts(unittest.TestCase):\n    def test_card_uses_agency_instead_of_raw_pncp_control_as_heading(self):\n        src = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        self.assertIn("reference = agency", src)\n        self.assertNotIn('reference = control or "Contratação pública"', src)\n\n    def test_home_and_portal_discovery_are_available(self):\n        src = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        app = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertIn("def home_page", src)\n        self.assertIn("def portal_page", src)\n        self.assertIn("🏠 Início", app)\n        self.assertIn("🌐 Por site de disputa", app)\n\n    def test_sidebar_menu_is_bold_but_main_content_stays_light(self):\n        src = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        self.assertIn('[data-testid="stSidebar"] .stButton button{font-weight:600 !important;}', src)\n        self.assertIn('[data-testid="stMain"] *{font-weight:400 !important;}', src)\n\n    def test_em_destaque_replaces_top50_label(self):\n        app = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertIn("🔥 Em destaque", app)\n        self.assertNotIn('"🏆 Top 50"', app)\n\n    def test_version_is_rc319(self):\n        cfg = (ROOT / "src" / "config.py").read_text(encoding="utf-8")\n        self.assertIn('APP_VERSION = "1.0 Essential RC31.9"', cfg)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Compile and run full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v

      - name: Commit validated patch and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc31-9-simple-discovery.yml
          git add app.py src/essential_discovery.py src/config.py tests/test_rc31_9_simple_discovery.py
          git commit -m "feat: simplificar descoberta no Essential RC31.9"
          git push origin HEAD:agent/rc31-9-simple-discovery
