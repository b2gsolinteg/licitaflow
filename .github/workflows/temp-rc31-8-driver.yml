name: Temporary RC31.8 Driver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-rc31-8-driver.yml

permissions:
  contents: write

jobs:
  patch-target-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-8-clean-essential
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Execute patch steps stored on target branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          path = Path('.github/workflows/rc31-8-clean-essential-patch.yml')
          text = path.read_text(encoding='utf-8')
          for target in ('Add Brazilian state flags', 'Apply clean Essential patch'):
              pattern = re.compile(rf'^      - name: {re.escape(target)}\n        run: \|\n(?P<body>(?:          .*\n)+)', re.M)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Etapa não encontrada: {target}')
              body = ''.join(line[10:] if line.startswith('          ') else line for line in match.group('body').splitlines(True))
              subprocess.run(['bash', '-lc', body], check=True)
          PY
      - name: Compile and test
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src tests
          python -m unittest discover -s tests -v
      - name: Commit patch to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc31-8-clean-essential-patch.yml
          git add .streamlit/config.toml app.py src/config.py src/sources.py src/database.py src/essential_discovery.py assets/state_flags tests/test_rc31_6_essential.py tests/test_rc31_8_clean_essential.py
          git commit -m "feat: simplificar Essential com busca clara e decisões rápidas"
          git push origin HEAD:agent/rc31-8-clean-essential
