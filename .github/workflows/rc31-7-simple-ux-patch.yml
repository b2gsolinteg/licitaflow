# retrigger RC31.7
name: RC31.7 Simple UX Patch

on:
  push:
    branches:
      - agent/rc31-7-simple-language-compact-ui

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-7-simple-language-compact-ui
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply UX patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado: {label}")
              return text.replace(old, new, 1)

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')

          app = app.replace('width:310px !important;', 'width:260px !important;')
          app = app.replace('min-width:310px !important;', 'min-width:260px !important;')
          app = app.replace('max-width:310px !important;', 'max-width:260px !important;')

          old_sidebar = '''        [data-testid="stSidebar"] .stButton button {
            width:100% !important; min-height:2.72rem !important; justify-content:flex-start !important;
            background:#FFFFFF !important; color:#172033 !important; border:1px solid #E2E8F0 !important;
            border-radius:10px !important; box-shadow:none !important; font-weight:750 !important;
        }
        [data-testid="stSidebar"] .stButton button * {color:#172033 !important;}
        [data-testid="stSidebar"] .stButton button[kind="primary"] {
            background:#10243F !important; border-color:#10243F !important; color:#FFFFFF !important;
            box-shadow:inset 4px 0 0 #C99A2E !important;
        }
        [data-testid="stSidebar"] .stButton button[kind="primary"] * {color:#FFFFFF !important;}
        [data-testid="stSidebar"] .st-key-sidebar_logout button {
            justify-content:center !important; background:#F2F5F8 !important; color:#516176 !important;
            border-color:#DDE4EC !important; box-shadow:none !important;
        }
        [data-testid="stSidebar"] .st-key-sidebar_logout button * {color:#516176 !important;}
        [data-testid="stSidebar"] [data-testid="stCaptionContainer"] {margin-top:.45rem !important;}
'''
          new_sidebar = '''        [data-testid="stSidebar"] .stButton button {
            width:100% !important; min-height:2.18rem !important; justify-content:flex-start !important;
            padding:.22rem .52rem !important; background:#FFFFFF !important; color:#172033 !important;
            border:1px solid #E2E8F0 !important; border-radius:8px !important; box-shadow:none !important;
            font-weight:720 !important; font-size:.84rem !important;
        }
        [data-testid="stSidebar"] .stButton button * {color:#172033 !important;}
        [data-testid="stSidebar"] .stButton button[kind="primary"] {
            background:#FFF8E7 !important; border-color:#D6A52E !important; color:#10243F !important;
            box-shadow:inset 3px 0 0 #C99A2E !important;
        }
        [data-testid="stSidebar"] .stButton button[kind="primary"] * {color:#10243F !important;}
        [data-testid="stSidebar"] .st-key-sidebar_logout button {
            justify-content:center !important; background:#F2F5F8 !important; color:#516176 !important;
            border-color:#DDE4EC !important; box-shadow:none !important;
        }
        [data-testid="stSidebar"] .st-key-sidebar_logout button * {color:#516176 !important;}
        [data-testid="stSidebar"] [data-testid="stCaptionContainer"] {margin-top:.20rem !important;margin-bottom:.05rem !important;}
        [data-testid="stSidebar"] [data-testid="stImage"] {margin:.05rem 0 .28rem !important;}
        [data-testid="stSidebar"] [data-testid="stImage"] img {
            max-width:205px !important; width:205px !important; margin:0 auto !important; display:block !important;
        }
'''
          app = replace_once(app, old_sidebar, new_sidebar, 'sidebar RC31.6')

          app = app.replace(
              'style="color:#10243F;font-weight:850">LicitaNexo · {APP_VERSION}',
              'style="color:#10243F;font-weight:850;font-size:.88rem">LicitaNexo · {APP_VERSION}',
              1,
          )
          app = app.replace(
              'padding:.65rem .72rem;margin-bottom:.75rem',
              'padding:.46rem .58rem;margin-bottom:.48rem',
              1,
          )
          app = app.replace(
              'font-weight:850;color:#172033">{_greeting(user)} 👋',
              'font-weight:850;color:#172033;font-size:.90rem">{_greeting(user)} 👋',
              1,
          )
          app = app.replace(
              'font-size:.76rem;color:#718096">{escape(str(user.get("name") or user.get("email") or "Minha conta"))}',
              'font-size:.70rem;color:#718096">{escape(str(user.get("name") or user.get("email") or "Minha conta"))}',
              1,
          )
          app_path.write_text(app, encoding='utf-8')

          discovery_path = Path('src/essential_discovery.py')
          d = discovery_path.read_text(encoding='utf-8')

          style_anchor = '''        .ln-section-label{font-size:.72rem;color:#66788D;font-weight:850;letter-spacing:.05em;text-transform:uppercase;margin:.95rem 0 .35rem}
        .ln-state-count{font-size:.73rem;color:#607086}
'''
          style_replacement = '''        .ln-section-label{font-size:.72rem;color:#66788D;font-weight:850;letter-spacing:.05em;text-transform:uppercase;margin:.95rem 0 .35rem}
        .ln-state-count{font-size:.73rem;color:#607086}
        [data-testid="stMain"] .stButton button[kind="secondary"]{
            background:#FFFFFF !important;color:#10243F !important;border:1px solid #D7E0EA !important;
            box-shadow:none !important;font-weight:720 !important;
        }
        [data-testid="stMain"] .stButton button[kind="secondary"] *{color:#10243F !important;}
        [data-testid="stMain"] .stButton button[kind="secondary"]:hover{
            background:#FFF8E7 !important;border-color:#D6A52E !important;
        }
        [data-testid="stMain"] div[class*="st-key-state_"] button{
            min-height:2.85rem !important;font-size:.92rem !important;font-weight:820 !important;
            background:#FFFFFF !important;color:#10243F !important;border:1px solid #CED8E4 !important;
        }
        [data-testid="stMain"] div[class*="st-key-state_"] button *{color:#10243F !important;}
'''
          d = replace_once(d, style_anchor, style_replacement, 'estilo dos botões')

          replacements = {
              'Itens estruturados temporariamente indisponíveis no PNCP.': 'Os itens ainda não estão disponíveis no PNCP.',
              'O PNCP não publicou itens estruturados para esta contratação.': 'O PNCP ainda não publicou a lista de itens desta licitação.',
              'Abertura / prazo': 'Data e prazo',
              '<div class="ln-object-label">Objeto</div>': '<div class="ln-object-label">O que o governo quer comprar ou contratar</div>',
              '🌐 Portal de disputa: ': '🌐 Onde participar: ',
              'Fonte do dado: {escape(source_name)}. {escape(access["detail"])}': '{escape(access["detail"])} Fonte: {escape(source_name)}.',
              'Nenhuma licitação encontrada com esses filtros. Altere apenas o que for necessário e pesquise novamente.': 'Nenhum edital aberto foi encontrado. Tente retirar um filtro ou pesquisar outra palavra.',
              'Digite o que procura e veja as oportunidades com os itens já abertos. Campo vazio amplia a busca.': 'Pesquise pelo que deseja vender. Se deixar em branco, mostramos editais de vários tipos.',
              'Comece por uma palavra, um estado ou simplesmente clique em Buscar licitações para explorar tudo que está aberto.': 'Digite uma palavra, escolha um estado ou clique em Buscar licitações para ver editais abertos.',
              'Localizando oportunidades abertas...': 'Buscando editais abertos...',
              '### Oportunidades': '### Editais abertos para participação',
              'Escolha uma UF e veja diretamente as licitações que ainda estão abertas.': 'Escolha um estado para ver os editais abertos para participação.',
              'Ainda não há estados disponíveis no catálogo.': 'Ainda não há editais abertos por estado.',
              'Digite o município e veja as licitações abertas naquela cidade.': 'Digite a cidade para ver os editais abertos para participação.',
              'Escolha como o órgão está contratando e veja as oportunidades abertas.': 'Escolha a modalidade para ver os editais abertos para participação.',
              'Nenhuma modalidade disponível no catálogo agora.': 'Nenhum edital aberto foi encontrado por modalidade agora.',
              'Combine apenas os filtros que fizerem sentido. Nenhum campo é obrigatório.': 'Use só os filtros que quiser. Você não precisa preencher todos.',
              'Palavra ou frase do objeto': 'O que você procura?',
              'Prazo a partir de': 'Participação a partir de',
              'Prazo até': 'Participação até',
              '50 oportunidades recentes com prazo aberto para você explorar sem precisar configurar um perfil.': '50 editais abertos para você explorar agora.',
              'Aqui ficam as oportunidades que chamaram sua atenção. Só leve para preparação quando decidir estudar de verdade.': 'Aqui ficam os editais que você salvou. Quando quiser participar, comece a preparação.',
              'Sua lista está vazia. Salve oportunidades durante a pesquisa e volte aqui quando quiser decidir.': 'Sua lista está vazia. Salve um edital durante a pesquisa para encontrá-lo aqui depois.',
              'Opcional: salve alguns interesses para o Radar. Você pode usar todo o LicitaNexo sem preencher esta tela.': 'Se quiser, salve o que costuma procurar. Isso ajuda o Radar, mas não é obrigatório.',
              'Preferências salvas. Elas servem apenas como atalho para o Radar.': 'Preferências salvas.',
              'Novas oportunidades relacionadas ao que você escolheu acompanhar — sem score e sem exigir CNAE.': 'Veja editais novos relacionados ao que você escolheu acompanhar.',
              'Você ainda não salvou preferências. Isso é opcional; use Buscar licitações normalmente ou configure o Radar quando quiser.': 'Você ainda não escolheu o que quer acompanhar. Continue usando a busca normalmente ou configure o Radar quando quiser.',
              'Encontrado porque você acompanha: ': 'Você acompanha: ',
          }
          for old, new in replacements.items():
              if old not in d:
                  raise SystemExit(f'Texto não encontrado em essential_discovery.py: {old}')
              d = d.replace(old, new)

          d = d.replace(
              'st.caption(f"{len(items)} licitação(ões) encontrada(s).")',
              'st.caption(f"{len(items):,} editais abertos para participação".replace(",", "."))',
          )
          d = d.replace(
              'st.caption(f"{total:,} licitação(ões)".replace(",", "."))',
              'st.caption(f"{total:,} editais abertos".replace(",", "."))',
          )
          d = d.replace(
              'if col.button(f"{state} · {total:,}".replace(",", "."), key=f"state_{state}", width="stretch"):',
              'if col.button(f"{state} · {total:,} editais".replace(",", "."), key=f"state_{state}", width="stretch"):',
          )
          discovery_path.write_text(d, encoding='utf-8')

          test_path = Path('tests/test_rc31_7_simple_ux.py')
          test_path.write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\n\nclass SimpleUxContracts(unittest.TestCase):\n    def test_discovery_uses_plain_language_and_readable_state_buttons(self):\n        text = (ROOT / "src" / "essential_discovery.py").read_text(encoding="utf-8")\n        self.assertIn("editais abertos para participação", text)\n        self.assertIn("O que o governo quer comprar ou contratar", text)\n        self.assertIn("Onde participar", text)\n        self.assertIn('div[class*="st-key-state_"] button', text)\n        self.assertNotIn("sem score e sem exigir CNAE", text)\n\n    def test_sidebar_is_compact_and_selected_item_does_not_hide_text(self):\n        text = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertIn("width:260px !important", text)\n        self.assertIn("min-height:2.18rem !important", text)\n        self.assertIn("background:#FFF8E7 !important", text)\n        self.assertIn("max-width:205px !important", text)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Compile
        run: python -m compileall -q app.py src tests

      - name: Full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit validated patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/essential_discovery.py tests/test_rc31_7_simple_ux.py
          git rm .github/workflows/rc31-7-simple-ux-patch.yml
          git commit -m "feat: linguagem simples e navegação compacta"
          git push origin HEAD:agent/rc31-7-simple-language-compact-ui
