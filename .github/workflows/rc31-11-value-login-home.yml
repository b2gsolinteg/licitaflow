name: RC31.11 Value Login Home

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-11-value-login-home
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Apply RC31.11 patch
        run: |
          python scripts/rc31_11_patch.py
          python scripts/rc31_11_test_compat.py
      - name: Validate
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/rc31-11-value-login-home.yml scripts/rc31_11_patch.py scripts/rc31_11_test_compat.py
          git add app.py src/essential_discovery.py src/config.py tests docs/rc31-11-value-login-home.md
          git commit -m "feat: reforçar valor para iniciantes RC31.11"
          git push origin HEAD:agent/rc31-11-value-login-home
