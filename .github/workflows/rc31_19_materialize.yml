name: RC31.19 Materialize Navigation Density

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feat/rc31-19-navigation-density'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc31-19-navigation-density
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.19
        run: python scripts/rc31_19_apply.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite unit suite before commit
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Remove materializer and commit real source
        run: |
          rm -f scripts/rc31_19_apply.py .github/workflows/rc31_19_materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/config.py src/essential_discovery.py tests .github/workflows scripts
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 1
          fi
          git commit -m "feat: materializar navegação visual RC31.19"
          git push origin HEAD:feat/rc31-19-navigation-density
