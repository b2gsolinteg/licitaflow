name: RC31.1 Integration Patch

on:
  push:
    branches:
      - agent/company-intelligence-pricing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-intelligence-pricing
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply deterministic RC31.1 patch
        run: python scripts/patch_rc31_1.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Commit RC31.1 and remove one-shot tooling
        run: |
          rm -f scripts/patch_rc31_1.py .github/workflows/rc31-1-patch.yml
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: integrar UX performance fornecedores jornada e itens PNCP"
          git push origin HEAD:agent/company-intelligence-pricing
