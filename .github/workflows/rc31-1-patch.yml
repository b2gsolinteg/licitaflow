name: RC31.1 Integration Patch

on:
  push:
    branches:
      - agent/company-intelligence-pricing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-intelligence-pricing
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply deterministic RC31.1 patch
        run: |
          set +e
          python scripts/patch_rc31_1.py 2>&1 | tee /tmp/rc31_patch.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/rc31_patch.log RC31_1_PATCH_ERROR.txt
            git config user.name "licitanexo-bot"
            git config user.email "actions@users.noreply.github.com"
            git add RC31_1_PATCH_ERROR.txt
            git commit -m "chore: registrar falha do patch RC31.1" || true
            git push origin HEAD:agent/company-intelligence-pricing || true
            exit "$status"
          fi

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/rc31_tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/rc31_tests.log RC31_1_TEST_ERROR.txt
            git config user.name "licitanexo-bot"
            git config user.email "actions@users.noreply.github.com"
            git add RC31_1_TEST_ERROR.txt
            git commit -m "chore: registrar falha dos testes RC31.1" || true
            git push origin HEAD:agent/company-intelligence-pricing || true
            exit "$status"
          fi

      - name: Commit RC31.1 and remove one-shot tooling
        run: |
          rm -f scripts/patch_rc31_1.py .github/workflows/rc31-1-patch.yml .github/rc31-1-trigger.txt RC31_1_PATCH_ERROR.txt RC31_1_TEST_ERROR.txt
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: integrar UX performance fornecedores jornada e itens PNCP"
          git push origin HEAD:agent/company-intelligence-pricing
