name: RC31.6 Essential Discovery

on:
  push:
    branches:
      - agent/rc31-6-essential-discovery
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  LICITANEXO_DB_BACKEND: sqlite

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rc31-6-essential-discovery
          fetch-depth: 0

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.6 patch
        run: python scripts/patch_rc31_6_essential.py

      - name: Compile application
        run: python -m compileall -q app.py src tests

      - name: Run focused Essential tests
        run: python -m unittest tests.test_rc31_6_essential -v

      - name: Run full SQLite suite
        run: python -m unittest discover -s tests -v

      - name: Verify product contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          discovery = Path('src/essential_discovery.py').read_text(encoding='utf-8')
          company = Path('src/company_ui.py').read_text(encoding='utf-8')
          config = Path('src/config.py').read_text(encoding='utf-8')
          assert '🔎 Buscar licitações' in app
          assert '❤️ Minha lista' in app
          assert '🗺️ Por Estado' in app
          assert 'Portal de disputa' in discovery
          assert 'Mostrar mais 20 itens' in discovery
          assert '_match_score' not in discovery
          assert 'CNAEs / atividades formais' not in company
          assert 'APP_VERSION = "1.0 Essential RC31.6"' in config
          print('RC31_6_CONTRACTS=PASS')
          PY

      - name: Remove one-shot tooling and commit validated patch
        run: |
          rm -f scripts/patch_rc31_6_essential.py .github/workflows/rc31-6-essential.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: simplificar descoberta para iniciantes RC31.6"
            git push origin HEAD:agent/rc31-6-essential-discovery
          fi
