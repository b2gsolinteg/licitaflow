name: RC31.1 Final Validation

on:
  push:
    branches:
      - agent/company-intelligence-pricing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LICITANEXO_TEST_POSTGRES: "1"
      LICITANEXO_PGHOST: 127.0.0.1
      LICITANEXO_PGPORT: "5432"
      LICITANEXO_PGDATABASE: postgres
      LICITANEXO_PGUSER: postgres
      LICITANEXO_PGPASSWORD: postgres
      LICITANEXO_PGSSLMODE: disable
      LICITANEXO_PG_POOL_MIN: "1"
      LICITANEXO_PG_POOL_MAX: "3"
      LICITANEXO_SCHEMA_STRICT: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-intelligence-pricing
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply final polish
        run: python scripts/patch_rc31_1_final.py

      - name: Compile all Python
        run: python -m compileall -q app.py src scripts tests

      - name: SQLite full suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
          LICITANEXO_TEST_POSTGRES: "0"
        run: python -m unittest discover -s tests -v

      - name: PostgreSQL migrations and integrations
        env:
          LICITANEXO_DB_BACKEND: postgres
          LICITANEXO_TEST_POSTGRES: "1"
        run: python -m unittest discover -s tests -p 'test_postgres*.py' -v

      - name: Verify PostgreSQL schema checker
        env:
          LICITANEXO_DB_BACKEND: postgres
          LICITANEXO_TEST_POSTGRES: "1"
          LICITANEXO_DB_SCHEMA: licitanexo_ci
        run: python scripts/check_postgres_schema.py

      - name: Commit validated RC31.1 and remove one-shot tooling
        run: |
          rm -f scripts/patch_rc31_1_final.py .github/workflows/rc31-1-final-validation.yml
          git config user.name "licitanexo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalizar RC31.1 com compatibilidade PostgreSQL" || exit 0
          git push origin HEAD:agent/company-intelligence-pricing
