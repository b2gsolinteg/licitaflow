name: RC31.12 Apply Premium UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/rc31-12-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Check whether patch still needs to run
        id: check
        shell: bash
        run: |
          if [ -f scripts/rc31_12_patch.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.apply == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        if: steps.check.outputs.apply == 'true'
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Make header patch resilient
        if: steps.check.outputs.apply == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/rc31_12_patch.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Upgrade page headers without touching functional logic of the forms/results.'
          if marker in s:
              start = s.index(marker)
              end = s.index('# Modern pagination glyphs -> Material Symbols.', start)
              robust = '''# Upgrade page headers without touching functional logic of the forms/results.\nheader_lines = [\n    (\"Buscar licitações\", \"Escolha só o que fizer sentido. Campos vazios deixam a busca mais ampla.\", \"ENCONTRE OPORTUNIDADES\"),\n    (\"Filtro avançado\", \"Combine os filtros que quiser. Nenhum campo é obrigatório.\", \"REFINE SUA BUSCA\"),\n    (\"Em destaque\", \"50 editais recentes para você explorar sem precisar definir uma busca.\", \"DESCUBRA OPORTUNIDADES\"),\n    (\"Minha lista\", \"Decida apenas se vai participar, não vai participar ou quer descartar o edital.\", \"ORGANIZE SUAS OPORTUNIDADES\"),\n    (\"Preferências\", \"Se quiser, salve o que costuma procurar. Isso ajuda o Radar, mas não é obrigatório.\", \"PERSONALIZE O LICITANEXO\"),\n    (\"Radar de licitações\", \"Veja editais novos relacionados ao que você escolheu acompanhar.\", \"ACOMPANHE O QUE IMPORTA\"),\n]\nfor title, subtitle, kicker in header_lines:\n    title_line = f'st.markdown(\\'<div class=\"ln-discovery-title\">{title}</div>\\', unsafe_allow_html=True)'\n    sub_line = f'st.markdown(\\'<div class=\"ln-discovery-sub\">{subtitle}</div>\\', unsafe_allow_html=True)'\n    if title_line in s and sub_line in s:\n        s = s.replace(title_line, f'_page_header(\"{kicker}\", \"{title}\", \"{subtitle}\")', 1)\n        s = s.replace(sub_line, '', 1)\n\n'''
              p.write_text(s[:start] + robust + s[end:], encoding='utf-8')
          PY
      - name: Apply RC31.12 patch
        if: steps.check.outputs.apply == 'true'
        run: python scripts/rc31_12_patch.py
      - name: Validate compile and SQLite suite
        if: steps.check.outputs.apply == 'true'
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src scripts tests
          python -m unittest discover -s tests -v
      - name: Confirm release version
        if: steps.check.outputs.apply == 'true'
        run: |
          grep -F 'APP_VERSION = "1.0 Essential RC31.12"' src/config.py
      - name: Commit validated application files
        if: steps.check.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/rc31-12-premium-ui.yml scripts/rc31_12_patch.py
          git add app.py src/essential_discovery.py src/config.py tests docs/rc31-12-premium-ui.md
          git commit -m "fix: aplicar de fato o redesign RC31.12"
          git push origin HEAD:${{ github.head_ref }}
