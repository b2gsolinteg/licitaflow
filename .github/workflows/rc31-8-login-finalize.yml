name: RC31.8 Login Finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc31-8-clean-essential
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Reuse validated login patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/rc31-8-login-cleanup-fixed.yml').read_text(encoding='utf-8')
          marker = '      - name: Simplify login visual\n        run: |\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Patch de login não encontrado')
          start += len(marker)
          end = text.find('\n      - name:', start)
          raw = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          subprocess.run(['bash', '-lc', body], check=True)
          PY
      - name: Compile and run full SQLite suite
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: |
          python -m compileall -q app.py src tests
          python -m unittest discover -s tests -v
      - name: Restore normal Quality Gate and commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality.yml
          git rm .github/workflows/rc31-8-login-cleanup-fixed.yml
          git rm .github/workflows/rc31-8-login-finalize.yml
          git add -A
          git commit -m "style: deixar entrada do Essential clara e neutra"
          git push origin HEAD:agent/rc31-8-clean-essential
