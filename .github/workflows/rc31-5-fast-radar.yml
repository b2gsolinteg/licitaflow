name: RC31.5 Fast Radar

on:
  push:
    branches:
      - agent/rc31-5-fast-radar-sidebar
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  LICITANEXO_DB_BACKEND: sqlite

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rc31-5-fast-radar-sidebar
          fetch-depth: 0

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.5 patch
        run: python scripts/patch_rc31_5_fast_radar.py

      - name: Compile application
        run: python -m compileall -q app.py src tests

      - name: Run RC31.5 focused tests
        run: python -m unittest tests.test_rc31_5_fast_radar -v

      - name: Run full SQLite suite
        run: python -m unittest discover -s tests -v

      - name: Verify app import contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          assert 'per_page = 8' in source
          assert '📦 Itens da licitação' in source
          assert 'MENU LATERAL TOTALMENTE PREENCHIDO' in source
          assert 'APP_VERSION = "1.0 Essential RC31.5"' in Path('src/config.py').read_text(encoding='utf-8')
          print('RC31_5_CONTRACTS=PASS')
          PY

      - name: Remove one-shot tooling and commit validated patch
        if: github.event_name == 'push'
        run: |
          rm -f scripts/patch_rc31_5_fast_radar.py .github/workflows/rc31-5-fast-radar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: radar rápido com itens abertos RC31.5"
            git push origin HEAD:agent/rc31-5-fast-radar-sidebar
          fi
