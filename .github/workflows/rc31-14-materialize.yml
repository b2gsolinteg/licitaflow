name: RC31.14 Materialize Density Polish

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feat/rc31-14-density-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc31-14-density-polish
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply RC31.14 density polish
        run: python scripts/rc31_14_apply.py

      - name: Compile application
        run: python -m compileall -q app.py src scripts tests

      - name: Run SQLite unit suite before commit
        env:
          LICITANEXO_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Remove one-time materializer and commit real source
        run: |
          git rm .github/workflows/rc31-14-materialize.yml scripts/rc31_14_apply.py
          git add src/config.py src/essential_discovery.py tests/test_rc31_6_essential.py tests/test_rc31_9_simple_discovery.py tests/test_rc31_10_modern_filters.py tests/test_rc31_13_premium_ui.py tests/test_rc31_14_density.py
          git config user.name "b2gsolinteg"
          git config user.email "b2gsolinteg@gmail.com"
          git commit -m "feat: compactar interface Essential RC31.14"
          git push origin HEAD:feat/rc31-14-density-polish
